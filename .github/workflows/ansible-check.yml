name: Ansible Validate

on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR revision without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Ansible
        run: pip install 'ansible==14.2.0'

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install ansible-lint
        run: pip install 'ansible-lint==26.6.0'

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

      - name: Syntax check playbooks
        working-directory: ansible
        run: |
          for playbook in site.yml network-update.yml switch.yml vps.yml bootstrap-vps.yml vps-livekit.yml vps-udp-probe.yml; do
            ansible-playbook "playbooks/$playbook" --syntax-check
          done

      - name: Assert proxmox-only hosts in site.yml
        working-directory: ansible
        shell: bash
        run: |
          hosts=$(ansible-playbook playbooks/site.yml --list-hosts 2>/dev/null | awk '/hosts \([0-9]+\):/{f=1;next} f && NF {gsub(/^ +/, ""); print}')
          for host in main data toliunit; do
            if ! echo "$hosts" | grep -qw "$host"; then
              echo "Expected host '$host' not found in site.yml"
              exit 1
            fi
          done
          if [ "$(echo "$hosts" | wc -l)" -ne 3 ]; then
            echo "Expected exactly three proxmox hosts; found: $hosts"
            exit 1
          fi
