name: OpenTofu Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan first, then run apply after reviewing the change
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # Commit the encrypted state after a successful apply.

jobs:
  run:
    if: github.ref == 'refs/heads/main' && github.actor == 'turtton'
    runs-on: ubuntu-latest
    env:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_tailscale_oauth_client_id: ${{ secrets.TAILSCALE_ACL_OAUTH_CLIENT_ID }}
      TF_VAR_tailscale_oauth_client_secret: ${{ secrets.TAILSCALE_ACL_OAUTH_SECRET }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "main,192.168.11.100 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMkCTXlzg8cpMVYdAEU22ZPFJfImi+sGrriOV6WL9V7P" >> ~/.ssh/known_hosts
          echo "data,192.168.11.40 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID6rwVVKY/hjjO8ACNkvd1F3HjBX6xfpIv7be/Bvqxbn" >> ~/.ssh/known_hosts

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init -input=false -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: terraform
        shell: bash
        run: |
          set +e
          tofu plan -detailed-exitcode -input=false -no-color -out=/tmp/tofu-plan.bin > /tmp/tofu-plan.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            echo '::error::OpenTofu plan failed. Detailed output is withheld from public Actions logs.'
            exit "$result"
          fi
          # Keep resource details and values out of the public Actions log.
          tofu show -json /tmp/tofu-plan.bin | jq -c '
            [.resource_changes[]? | select(.change.actions != ["no-op"]) | (.change.actions | join("/"))]
            | {count: length, action_counts: (group_by(.) | map({action: .[0], count: length}))}
          ' > /tmp/tofu-plan-summary.json
          change_count=$(jq -r '.count' /tmp/tofu-plan-summary.json)
          if { [ "$result" -eq 0 ] && [ "$change_count" -ne 0 ]; } ||
             { [ "$result" -eq 2 ] && [ "$change_count" -eq 0 ]; }; then
            echo '::error::OpenTofu exit code disagrees with the saved plan. Apply is blocked.'
            exit 1
          fi
          if [ "$change_count" -gt 0 ]; then
            echo 'changes=true' >> "$GITHUB_OUTPUT"
            echo 'OpenTofu plan completed with changes.'
          else
            echo 'changes=false' >> "$GITHUB_OUTPUT"
            echo 'OpenTofu plan completed with no changes.'
          fi
          jq -r '.action_counts[] | "\(.action): \(.count)"' /tmp/tofu-plan-summary.json
          rm -f /tmp/tofu-plan-summary.json

      - name: Confirm main still matches the reviewed revision
        if: inputs.mode == 'apply'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::main changed during this run. Re-run against the latest revision.'
            exit 1
          fi

      - name: OpenTofu Apply
        if: inputs.mode == 'apply' && steps.plan.outputs.changes == 'true'
        working-directory: terraform
        run: |
          if ! tofu apply -input=false -no-color /tmp/tofu-plan.bin > /tmp/tofu-apply.log 2>&1; then
            echo '::error::OpenTofu apply failed. Detailed output is withheld from public Actions logs.'
            exit 1
          fi
          echo 'OpenTofu apply completed.'

      - name: Commit encrypted state
        if: inputs.mode == 'apply' && success()
        working-directory: terraform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c state-update
          git add terraform.tfstate
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'Update encrypted terraform state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
