name: Ansible Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check first, then apply after reviewing the change
        required: true
        type: choice
        default: check
        options:
          - check
          - apply
      playbook:
        description: Playbook to run
        required: true
        type: choice
        options:
          - site.yml
          - network-update.yml
          - vps.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main' && github.actor == 'turtton'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Ansible
        run: pip install 'ansible==14.2.0'

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          install -m 755 sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Validate target
        id: target
        env:
          PLAYBOOK: ${{ inputs.playbook }}
        run: |
          case "$PLAYBOOK" in
            site.yml|network-update.yml) echo 'group=proxmox' >> "$GITHUB_OUTPUT" ;;
            vps.yml) echo 'group=vps' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Unsupported playbook'; exit 1 ;;
          esac

      - name: Confirm main still matches the reviewed revision
        if: inputs.mode == 'apply'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::main changed during this run. Re-run against the latest revision.'
            exit 1
          fi

      - name: Run Ansible
        working-directory: ansible
        env:
          PLAYBOOK: ${{ inputs.playbook }}
          MODE: ${{ inputs.mode }}
          TARGET_GROUP: ${{ steps.target.outputs.group }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ "$MODE" = check ]; then
            if ! ansible-playbook "playbooks/$PLAYBOOK" --check --diff --limit "$TARGET_GROUP" > /tmp/ansible-run.log 2>&1; then
              echo '::error::Ansible check failed. Detailed output is withheld from public Actions logs.'
              exit 1
            fi
            echo 'Ansible check completed.'
          elif [ "$MODE" = apply ]; then
            if ! ansible-playbook "playbooks/$PLAYBOOK" --limit "$TARGET_GROUP" > /tmp/ansible-run.log 2>&1; then
              echo '::error::Ansible apply failed. Detailed output is withheld from public Actions logs.'
              exit 1
            fi
            echo 'Ansible apply completed.'
          else
            echo '::error::Unsupported mode'
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
