name: Flux CD Validate

on:
  pull_request:
    paths:
      - "clusters/**"
      - "tests/scripts/atm10-observability-test.sh"
      - ".github/workflows/flux-check.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected branch HEAD when dispatched by the Fluxer updater
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install yq and jq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      - name: Validate ATM10 observability contract
        run: bash tests/scripts/atm10-observability-test.sh

      - name: Validate manifests
        id: validate
        shell: bash
        run: |
          set +e
          kustomize build clusters/main/ 2>&1 | kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            2>&1 | tee /tmp/validate.log
          PIPE_STATUS=("${PIPESTATUS[@]}")
          if [ "${PIPE_STATUS[0]}" -ne 0 ]; then
            EXIT_CODE=${PIPE_STATUS[0]}
          else
            EXIT_CODE=${PIPE_STATUS[1]}
          fi
          {
            echo "output<<VALIDATE_EOF"
            tail -80 /tmp/validate.log
            echo "VALIDATE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Comment validation result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          VALIDATE_OUTPUT: ${{ steps.validate.outputs.output }}
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
        with:
          script: |
            const marker = '<!-- flux-validate -->';
            const exitCode = process.env.VALIDATE_EXIT_CODE;
            const status = exitCode === '0' ? '✅ Validation passed' : '❌ Validation failed';
            const output = process.env.VALIDATE_OUTPUT;
            const body = `${marker}\n### ${status}\n\n<details><summary>Validation output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
