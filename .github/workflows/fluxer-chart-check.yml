name: Fluxer Chart Compatibility

on:
  pull_request:
    paths:
      - "charts/fluxer/**"
      - "clusters/main/apps/fluxer/**"
      - "tests/scripts/fluxer-chart-test.py"
      - "tests/fixtures/fluxer-deployment-contract.json"
      - "scripts/update-fluxer.py"
      - "tests/scripts/test-update-fluxer.py"
      - "tests/scripts/test-fluxer-chart-contract.py"
      - "tests/scripts/test-fluxer-update-workflow.py"
      - ".github/actions/setup-fluxer-tools/**"
      - ".github/workflows/fluxer-update.yml"
      - ".github/workflows/fluxer-update-kind.yml"
      - ".github/workflows/fluxer-chart-check.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected branch HEAD when dispatched by the updater
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-fluxer-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: ./.github/actions/setup-fluxer-tools
      - name: Test updater and compatibility guards
        run: |
          uv run --python 3.13 --with pyyaml==6.0.3 python tests/scripts/test-update-fluxer.py
          uv run --python 3.13 --with pyyaml==6.0.3 python tests/scripts/test-fluxer-chart-contract.py
          uv run --python 3.13 --with pyyaml==6.0.3 python tests/scripts/test-fluxer-update-workflow.py
      - name: Verify immutable upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 --with pyyaml==6.0.3 python scripts/update-fluxer.py --kind charts --verify-upstream
          uv run --python 3.13 --with pyyaml==6.0.3 python scripts/update-fluxer.py --kind images --verify-images
      - name: Render charts and validate migration contracts
        run: uv run --python 3.13 --with pyyaml==6.0.3 python tests/scripts/fluxer-chart-test.py
