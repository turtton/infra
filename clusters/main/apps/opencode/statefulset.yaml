---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opencode-server
  namespace: opencode
  labels:
    app: opencode-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-server
  template:
    metadata:
      labels:
        app: opencode-server
    spec:
      serviceAccountName: opencode-server
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-workspace
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /workspaces && chown 1000:1000 /workspaces
              mkdir -p /home/opencode/.config/opencode-go
              cp -L /config-tmp/* /home/opencode/.config/opencode-go/
              chown -R 1000:1000 /home/opencode/.config/opencode-go
          volumeMounts:
            - name: data
              mountPath: /workspaces
            - name: config-tmp
              mountPath: /config-tmp
            - name: config
              mountPath: /home/opencode/.config/opencode-go
      containers:
        - name: opencode-server
          image: ghcr.io/anomalyco/opencode:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              # Install gh CLI if not present
              if ! command -v gh >/dev/null 2>&1; then
                if command -v apk >/dev/null 2>&1; then
                  apk add --no-cache github-cli >/dev/null 2>&1 || true
                fi
              fi
              # Authenticate gh if token is available
              if [ -n "$GITHUB_TOKEN" ]; then
                echo "$GITHUB_TOKEN" | gh auth login --with-token 2>/dev/null || true
                gh auth setup-git 2>/dev/null || true
              fi
              # Start server
              exec opencode serve --port 4096 --hostname 0.0.0.0
          workingDir: /workspaces
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          env:
            - name: OPENCODE_CONFIG_DIR
              value: /home/opencode/.config/opencode-go
            - name: OPENCODE_CONFIG
              value: /home/opencode/.config/opencode-go/opencode.jsonc
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencode-server-secrets
                  key: GITHUB_TOKEN
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /home/opencode/.config/opencode-go
            - name: data
              mountPath: /workspaces
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: config
          emptyDir: {}
        - name: config-tmp
          configMap:
            name: opencode-server-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
