---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-server-ingress
  namespace: opencode
spec:
  podSelector:
    matchLabels:
      app: opencode-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - port: 4096
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
      ports:
        - port: 4096
          protocol: TCP
