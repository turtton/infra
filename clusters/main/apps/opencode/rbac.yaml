---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-server-self-access
  namespace: opencode
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-server-self-access
  namespace: opencode
subjects:
  - kind: ServiceAccount
    name: opencode-server
    namespace: opencode
roleRef:
  kind: Role
  name: opencode-server-self-access
  apiGroup: rbac.authorization.k8s.io
