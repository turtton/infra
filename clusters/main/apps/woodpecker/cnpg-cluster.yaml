---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: woodpecker-db
  namespace: woodpecker
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-system-trixie
  bootstrap:
    initdb:
      database: woodpecker
      owner: woodpecker
  storage:
    size: 15Gi
    storageClass: longhorn
  backup:
    barmanObjectStore:
      destinationPath: s3://forgejo-backup/woodpecker-cnpg/
      endpointURL: https://db189f6278d9d9fbdfd8dbf99a5e8c95.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: woodpecker-r2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: woodpecker-r2-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "15d"
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "128MB"
      effective_cache_size: "384MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "4MB"
      default_statistics_target: "100"
      random_page_cost: "4"
      effective_io_concurrency: "2"
      work_mem: "2MB"
      huge_pages: "off"
      min_wal_size: "64MB"
      max_wal_size: "256MB"
      archive_timeout: "1h"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
