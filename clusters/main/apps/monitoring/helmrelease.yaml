---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.19.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h0m0s
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheus:
      prometheusSpec:
        # worker-1/2/3 は 1vCPU/4GB の Longhornストレージ専用ノードのため配置禁止
        # (2026-07-25 CPU飽和による Helm リリース不全のインシデント対応)
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - worker-1
                        - worker-2
                        - worker-3
        enableOTLPReceiver: true
        otlp:
          promoteResourceAttributes:
            - service.instance.id
            - service.namespace
        retention: 7d
        query:
          timeout: 60s
        queryLogFile: /dev/stdout
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            metadata:
              annotations:
                data.longhorn.io/number-of-replicas: "2"
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
        additionalScrapeConfigs:
          - job_name: pve-main
            metrics_path: /metrics
            static_configs:
              - targets: ["192.168.10.100:9221"]
                labels:
                  pve_node: main
          - job_name: pve-data
            metrics_path: /metrics
            static_configs:
              - targets: ["192.168.10.40:9221"]
                labels:
                  pve_node: data
          - job_name: pve-toliunit
            metrics_path: /metrics
            static_configs:
              - targets: ["192.168.10.101:9221"]
                labels:
                  pve_node: toliunit

    grafana:
      # worker-1/2/3 (1vCPU Longhorn専用ノード) への配置禁止。prometheusSpec.affinity と同趣旨
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - worker-1
                      - worker-2
                      - worker-3
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 2Gi
        annotations:
          data.longhorn.io/number-of-replicas: "2"
      sidecar:
        datasources:
          timeout: 60
      grafana.ini:
        server:
          root_url: https://grafana.turtton.net
        auth.proxy:
          enabled: true
          header_name: Cf-Access-Authenticated-User-Email
          header_property: email
          auto_sign_up: true
        users:
          auto_assign_org: true
          auto_assign_org_role: Editor
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          jsonData:
            maxLines: 1000

    alertmanager:
      alertmanagerSpec:
        # worker-1/2/3 (1vCPU Longhorn専用ノード) への配置禁止。prometheusSpec.affinity と同趣旨
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - worker-1
                        - worker-2
                        - worker-3
        storage:
          volumeClaimTemplate:
            metadata:
              annotations:
                data.longhorn.io/number-of-replicas: "2"
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        alertmanagerConfiguration:
          name: global
          global:
            resolveTimeout: 5m

    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    # 1vCPU ノード (worker-1/2/3) では CPU スパイク時にデフォルト timeoutSeconds=1 の
    # probe がタイムアウトし liveness kill ループに陥るため緩和する
    prometheus-node-exporter:
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 5

    prometheusOperator: {}
