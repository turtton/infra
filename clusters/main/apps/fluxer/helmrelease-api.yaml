---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-api
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/fluxer/current/fluxer-api
      version: 0.1.0
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
      reconcileStrategy: Revision
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
  values:
    # Keep the running application version while migrating the chart layout.
    image:
      registry: ghcr.io/fluxerapp
      tag: v1
    # Disable upstream example endpoints and the default fluxer-env Secret.
    env: null
    envFrom: []
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    probes:
      startup:
        failureThreshold: 24
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
      liveness:
        failureThreshold: 3
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
      readiness:
        failureThreshold: 2
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - toliworker-1
                    - toliworker-2
                    - toliworker-3
    topologySpreadConstraints:
      - maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
    api:
      api:
        image:
          name: fluxer-api
          digest: sha256:9f6125bb99e0a1e77bf837b2d4afc7bc975d982afa185189928dee5061c82ad7
        replicas: 1
        minReadySeconds: 15
        terminationGracePeriodSeconds: 90
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 200m
            memory: 512Mi
        env: null
        extraEnv:
          - name: NODE_ENV
            value: production
          - name: FLUXER_ENV
            value: production
          - name: BUILD_VERSION
            value: v1
          - name: NODE_TLS_REJECT_UNAUTHORIZED
            value: '0'
          - name: FLUXER_STATIC_CDN_ENDPOINT
            value: https://chat.turtton.net
          - name: FLUXER_SELF_HOSTED
            value: 'true'
          - name: FLUXER_BASE_DOMAIN
            value: chat.turtton.net
          - name: FLUXER_TRUST_CLIENT_IP_HEADER
            value: 'true'
          - name: FLUXER_CLIENT_IP_HEADER_NAME
            value: x-forwarded-for
          - name: FLUXER_PUBLIC_SCHEME
            value: https
          - name: FLUXER_PUBLIC_PORT
            value: '443'
          - name: FLUXER_DATABASE_BACKEND
            value: postgres
          - name: FLUXER_POSTGRES_HOST
            value: fluxer-db-rw.fluxer.svc.cluster.local
          - name: FLUXER_POSTGRES_PORT
            value: '5432'
          - name: FLUXER_POSTGRES_DATABASE
            value: fluxer
          - name: FLUXER_POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: fluxer-db-app
          # CNPG auto-creates fluxer-db-app with the PostgreSQL password.
          - name: FLUXER_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: fluxer-db-app
          - name: FLUXER_POSTGRES_SSLMODE
            value: require
          - name: FLUXER_KV_URL
            value: redis://valkey.fluxer.svc.cluster.local:6379/0
          - name: FLUXER_NATS_URL
            value: nats://nats.fluxer.svc.cluster.local:4222
          - name: FLUXER_NATS_CORE_URL
            value: nats://nats.fluxer.svc.cluster.local:4222
          - name: FLUXER_NATS_JETSTREAM_URL
            value: nats://nats.fluxer.svc.cluster.local:4222
          - name: NATS_URL
            value: nats://nats.fluxer.svc.cluster.local:4222
          - name: FLUXER_SEARCH_ENGINE
            value: meilisearch
          - name: FLUXER_SEARCH_URL
            value: http://meilisearch.fluxer.svc.cluster.local:7700
          - name: FLUXER_SEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                key: MEILI_MASTER_KEY
                name: meilisearch-key
          - name: FLUXER_S3_ENDPOINT
            value: http://seaweedfs.fluxer.svc.cluster.local:8333
          - name: FLUXER_S3_REGION
            value: us-east-1
          - name: FLUXER_S3_FORCE_PATH_STYLE
            value: 'true'
          - name: FLUXER_S3_BUCKET_UPLOADS
            value: fluxer
          - name: FLUXER_ADMIN_SECRET_KEY_BASE
            valueFrom:
              secretKeyRef:
                key: admin_secret_key_base
                name: fluxer-runtime-keys
          - name: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                key: admin_oauth_client_secret
                name: fluxer-runtime-keys
          - name: FLUXER_SUDO_MODE_SECRET
            valueFrom:
              secretKeyRef:
                key: sudo_mode_secret
                name: fluxer-runtime-keys
          - name: FLUXER_CONNECTION_INITIATION_SECRET
            valueFrom:
              secretKeyRef:
                key: connection_initiation_secret
                name: fluxer-runtime-keys
          - name: FLUXER_GATEWAY_RPC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                key: gateway_rpc_auth_token
                name: fluxer-runtime-keys
          - name: FLUXER_VAPID_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                key: vapid_public_key
                name: fluxer-runtime-keys
          - name: FLUXER_VAPID_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                key: vapid_private_key
                name: fluxer-runtime-keys
          - name: FLUXER_VAPID_EMAIL
            value: noreply@chat.turtton.net
          - name: FLUXER_MEDIA_PROXY_SECRET_KEY
            valueFrom:
              secretKeyRef:
                key: media_proxy_secret_key
                name: fluxer-runtime-keys
          - name: FLUXER_INTERNAL_API_ENDPOINT
            value: http://api.fluxer.svc.cluster.local:8080
          - name: FLUXER_INTERNAL_GATEWAY_ENDPOINT
            value: http://gateway.fluxer.svc.cluster.local:8080
          - name: FLUXER_INTERNAL_MEDIA_PROXY_ENDPOINT
            value: http://media-proxy.fluxer.svc.cluster.local:8080
          - name: FLUXER_MEDIA_PROXY_ENDPOINT
            value: http://media-proxy.fluxer.svc.cluster.local:8080
          - name: FLUXER_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: FLUXER_S3_ACCESS_KEY_ID
                name: fluxer-s3-credentials
          - name: FLUXER_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: FLUXER_S3_SECRET_ACCESS_KEY
                name: fluxer-s3-credentials
          - name: FLUXER_LIVEKIT_ENABLED
            value: 'true'
          - name: FLUXER_LIVEKIT_URL
            value: wss://chat.turtton.net/livekit
          - name: FLUXER_LIVEKIT_API_KEY
            valueFrom:
              secretKeyRef:
                key: LIVEKIT_API_KEY
                name: livekit-keys
          - name: FLUXER_LIVEKIT_API_SECRET
            valueFrom:
              secretKeyRef:
                key: LIVEKIT_API_SECRET
                name: livekit-keys
          - name: FLUXER_LIVEKIT_WEBHOOK_URL
            value: http://api:8080/webhooks/livekit
          - name: FLUXER_LIVEKIT_DEFAULT_REGION
            value: '{"id":"default","name":"Default","emoji":"🌐","latitude":0,"longitude":0}'
          - name: FLUXER_EMAIL_ENABLED
            value: 'false'
          - name: FLUXER_CAPTCHA_ENABLED
            value: 'false'
          - name: FLUXER_SNOWFLAKE_SERVICE_BATCH_SIZE
            value: '128'
          - name: FLUXER_SNOWFLAKE_SERVICE_LOW_WATERMARK
            value: '32'
          - name: FLUXER_SNOWFLAKE_SERVICE_MAX_BUFFER_AGE_MS
            value: '5000'
          - name: FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64
            valueFrom:
              secretKeyRef:
                key: relay_secret_base64
                name: fluxer-upload-relay
        extraVolumeMounts:
          - mountPath: /etc/fluxer/keys
            name: keys
            readOnly: true
        extraVolumes:
          - name: keys
            secret:
              optional: true
              secretName: fluxer-keys
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - attempt=0; while [ "$attempt" -lt 3 ]; do curl -fsS --max-time 2 http://127.0.0.1:8080/_health
                  >/dev/null 2>&1 && break; attempt=$((attempt+1)); sleep 1; done; sleep 25
        pdb:
          minAvailable: 75%
    workers:
      worker: null
  # The API template does not pass values.command to its deployment helper.
  # Preserve the existing NATS startup wrapper through a container patch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: api
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: api
              spec:
                template:
                  spec:
                    containers:
                      - name: api
                        command:
                          - /bin/sh
                          - -c
                          - |-
                            cat > /tmp/fluxer-api-wrapper.ts <<'EOF'
                            async function main() {
                              const natsUrl = 'nats://nats.fluxer.svc.cluster.local:4222';

                              process.env.FLUXER_NATS_URL = natsUrl;
                              process.env.FLUXER_NATS_CORE_URL = natsUrl;
                              process.env.FLUXER_NATS_JETSTREAM_URL = natsUrl;
                              process.env.NATS_URL = natsUrl;

                              const {Config} = await import('/usr/src/app/fluxer_api/src/Config.ts');
                              Config.nats.coreUrl = natsUrl;
                              Config.nats.jetStreamUrl = natsUrl;

                              console.log(`[fluxer-api-wrapper] Config.nats.coreUrl=${Config.nats.coreUrl}`);

                              await import('/usr/src/app/fluxer_api/src/AppEntrypoint.ts');
                            }

                            main().catch((error) => {
                              console.error('[fluxer-api-wrapper] failed to start', error);
                              process.exit(1);
                            });
                            EOF

                            exec ./node_modules/.bin/tsx /tmp/fluxer-api-wrapper.ts
    # Keep Pod templates stable when infra main changes without chart changes.
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: "(Deployment|StatefulSet)"
            patch: |-
              - op: replace
                path: /spec/template/metadata/labels/helm.sh~1chart
                value: fluxer-api-0.1.0
