---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: fluxer
  labels:
    app: seaweedfs
spec:
  replicas: 1
  serviceName: seaweedfs
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.34
          command:
            - weed
            - server
            - -s3
            - -dir=/data
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: master
              containerPort: 9333
              protocol: TCP
            - name: filer
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
