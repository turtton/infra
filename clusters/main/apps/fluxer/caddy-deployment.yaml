---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2.10-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: internal
              containerPort: 8088
              protocol: TCP
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: caddyfile
          configMap:
            name: caddy
