---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-server
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-server
      app.kubernetes.io/instance: fluxer-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxer-server
        app.kubernetes.io/instance: fluxer-server
    spec:
      initContainers:
        - name: download-nsfw-model
          image: curlimages/curl:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              if [ ! -f /opt/data/model.onnx ]; then
                echo "Downloading NSFW model..."
                mkdir -p /opt/data
                curl -fsSL -o /opt/data/model.onnx https://github.com/fluxerworld/fluxerworld/releases/download/nsfw-model/model.onnx
                echo "Download complete"
              else
                echo "Model already exists"
              fi
          volumeMounts:
            - name: model-data
              mountPath: /opt/data
      containers:
        - name: fluxer-server
          image: ghcr.io/fluxerworld/fluxer-server:stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLUXER_CONFIG
              value: /usr/src/app/config/config.json
            - name: NODE_ENV
              value: production
            # Secrets from fluxer-runtime-keys
            - name: FLUXER_SUDO_MODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: sudo_mode_secret
            - name: FLUXER_CONNECTION_INITIATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: connection_initiation_secret
            - name: FLUXER_GATEWAY_RPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: gateway_rpc_auth_token
            - name: FLUXER_MEDIA_PROXY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: media_proxy_secret_key
            - name: FLUXER_ADMIN_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: admin_secret_key_base
            - name: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: admin_oauth_client_secret
            - name: FLUXER_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: vapid_public_key
            - name: FLUXER_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-runtime-keys
                  key: vapid_private_key
            # Meilisearch key
            - name: FLUXER_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-key
                  key: MEILI_MASTER_KEY
          volumeMounts:
            - name: config
              mountPath: /usr/src/app/config
              readOnly: true
            - name: data
              mountPath: /usr/src/app/data
            - name: model-data
              mountPath: /opt/data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: gateway
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: fluxer-server-config
        - name: data
          persistentVolumeClaim:
            claimName: fluxer-server-data
        - name: model-data
          emptyDir: {}
