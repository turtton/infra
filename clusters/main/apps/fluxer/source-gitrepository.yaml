---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fluxer-upstream
  namespace: fluxer
spec:
  interval: 1h
  url: https://github.com/fluxerapp/fluxer
  ref:
    # Keep the legacy per-service charts until migration to the new chart layout.
    # Renovate updates for this source are disabled in .github/renovate.json.
    commit: 0b6edf569086098ba5be58fc4990e5065a56d9ce
  ignore: |
    # Only include deploy/helm/ directory
    /*
    !/deploy/helm/
