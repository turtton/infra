---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fluxer-upstream
  namespace: fluxer
spec:
  # Legacy charts are vendored in infra and served by the flux-system source.
  # Suspend this source to avoid cloning the large upstream Git history.
  suspend: true
  interval: 1h
  url: https://github.com/fluxerapp/fluxer
  ref:
    # Keep the legacy per-service charts as a rollback reference.
    # Renovate updates for this source are disabled in .github/renovate.json.
    commit: 0b6edf569086098ba5be58fc4990e5065a56d9ce
  ignore: |
    # Only include deploy/helm/ directory
    /*
    !/deploy/helm/
