---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-gateway
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/helm/gateway
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: fluxer-upstream
        namespace: fluxer
      interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gateway
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: StatefulSet
              name: gateway-guilds
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: StatefulSet
              name: gateway-presence
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: StatefulSet
              name: gateway-sessions
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: StatefulSet
              name: gateway-calls
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: StatefulSet
              name: gateway-push
            patch: |-
              - op: remove
                path: /spec/template/spec/imagePullSecrets
              - op: remove
                path: /spec/template/spec/nodeSelector
          - target:
              kind: NetworkPolicy
              name: gateway
            patch: |-
              - op: replace
                path: /spec/ingress
                value:
                  - {}
  values:
    global:
      registry: ghcr.io/fluxerapp
      namespace: fluxer

    gateway:
      image: fluxer-gateway
      tag: v1
      replicas: 1
      port: 8080
      nodeSelector: {}
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - toliworker-1
                      - toliworker-2
                      - toliworker-3
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
                    app.kubernetes.io/instance: fluxer-gateway
                topologyKey: kubernetes.io/hostname
      env:
        # Common environment (matching docker-compose &fluxer-env)
        - name: FLUXER_ENV
          value: production
        - name: NODE_ENV
          value: production
        - name: FLUXER_SELF_HOSTED
          value: "true"
        - name: FLUXER_BASE_DOMAIN
          value: chat.turtton.net
        - name: FLUXER_PUBLIC_SCHEME
          value: https
        - name: FLUXER_PUBLIC_PORT
          value: "443"
        - name: FLUXER_TRUST_CLIENT_IP_HEADER
          value: "true"
        - name: FLUXER_CLIENT_IP_HEADER_NAME
          value: x-forwarded-for

        # Database
        - name: FLUXER_DATABASE_BACKEND
          value: postgres
        - name: FLUXER_POSTGRES_HOST
          value: fluxer-db-rw.fluxer.svc.cluster.local
        - name: FLUXER_POSTGRES_PORT
          value: "5432"
        - name: FLUXER_POSTGRES_DATABASE
          value: fluxer
        - name: FLUXER_POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: fluxer-db-app
              key: username
        - name: FLUXER_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluxer-db-app
              key: password
        - name: FLUXER_POSTGRES_SSLMODE
          value: require

        # KV / NATS
        - name: FLUXER_KV_URL
          value: redis://valkey.fluxer.svc.cluster.local:6379/0
        - name: FLUXER_NATS_URL
          value: nats://nats.fluxer.svc.cluster.local:4222
        - name: FLUXER_NATS_JETSTREAM_URL
          value: nats://nats.fluxer.svc.cluster.local:4222
        - name: FLUXER_SVC_NATS_URL
          value: nats://nats.fluxer.svc.cluster.local:4222
        - name: FLUXER_SVC_SHARD_COUNT
          value: "1"

        # Search
        - name: FLUXER_SEARCH_ENGINE
          value: meilisearch
        - name: FLUXER_SEARCH_URL
          value: http://meilisearch.fluxer.svc.cluster.local:7700
        - name: FLUXER_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-key
              key: MEILI_MASTER_KEY

        # S3
        - name: FLUXER_S3_ENDPOINT
          value: http://seaweedfs.fluxer.svc.cluster.local:8333
        - name: FLUXER_S3_REGION
          value: us-east-1
        - name: FLUXER_S3_FORCE_PATH_STYLE
          value: "true"
        - name: FLUXER_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: fluxer-s3-credentials
              key: FLUXER_S3_ACCESS_KEY_ID
        - name: FLUXER_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fluxer-s3-credentials
              key: FLUXER_S3_SECRET_ACCESS_KEY
        - name: FLUXER_S3_BUCKET_CDN
          value: fluxer
        - name: FLUXER_S3_BUCKET_UPLOADS
          value: fluxer-uploads

        # Gateway-specific
        - name: FLUXER_GATEWAY_PORT
          value: "8080"
        - name: FLUXER_GATEWAY_MEDIA_PROXY_ENDPOINT
          value: https://chat.turtton.net/media
        - name: FLUXER_GATEWAY_STATIC_CDN_ENDPOINT
          value: https://chat.turtton.net
        - name: FLUXER_GATEWAY_LOGGER_LEVEL
          value: info
        - name: FLUXER_INTERNAL_API_ENDPOINT
          value: http://api.fluxer.svc.cluster.local:8080
        - name: FLUXER_GATEWAY_RPC_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: gateway_rpc_auth_token
        - name: FLUXER_MEDIA_PROXY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: media_proxy_secret_key

        # Auth secrets (required by gateway)
        - name: FLUXER_SUDO_MODE_SECRET
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: sudo_mode_secret
        - name: FLUXER_CONNECTION_INITIATION_SECRET
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: connection_initiation_secret
        - name: FLUXER_VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: vapid_public_key
        - name: FLUXER_VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: vapid_private_key
        - name: FLUXER_VAPID_EMAIL
          value: noreply@chat.turtton.net

    cluster:
      enabled: true
      discoveryDnsName: fluxer-gateway-headless.fluxer.svc.cluster.local
      discoveryNodeBasename: fluxer_gateway
      erlangDistribution:
        port: 8081
        epmdPort: 4369
      erlangCookieSecret:
        name: fluxer-gateway-erlang-cookie
        key: cookie

    roles:
      enabled: true
      websocket:
        role: websocket
      common:
        nodeSelector: {}
        tolerations: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      sessions:
        enabled: true
        replicas: 1
      presence:
        enabled: true
        replicas: 1
      guilds:
        enabled: true
        replicas: 1
      calls:
        enabled: false
      push:
        enabled: true
        replicas: 1
