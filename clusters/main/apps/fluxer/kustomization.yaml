# WARNING: This kustomization must ONLY reference files within this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - runtime-keys.sops.yaml
  # fluxer-server (monolith)
  - fluxer-server-config.yaml
  - fluxer-server-pvc.yaml
  - fluxer-server-deployment.yaml
  - fluxer-server-service.yaml
  # Infrastructure services
  - nats-statefulset.yaml
  - nats-service.yaml
  - meilisearch-key.sops.yaml
  - meilisearch-statefulset.yaml
  - meilisearch-service.yaml
  - valkey-deployment.yaml
  - valkey-service.yaml
  # Reverse proxy
  - caddy-configmap.yaml
  - caddy-deployment.yaml
  - caddy-service.yaml
