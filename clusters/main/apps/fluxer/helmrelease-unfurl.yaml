---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-unfurl
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/helm/unfurl
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: fluxer-upstream
        namespace: fluxer
      interval: 1h
  values:
    global:
      registry: ghcr.io/fluxerapp
      namespace: fluxer

    svc:
      name: unfurl
      image: fluxer-unfurl
      tag: v1
      nats:
        url: nats://nats.fluxer.svc.cluster.local:4222
      shard:
        replicas: 0
      router:
        replicas: 1
      extraEnv:
        - name: FLUXER_MEDIA_PROXY_ENDPOINT
          value: http://media-proxy:8080
        - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
          value: https://chat.turtton.net/media
        - name: FLUXER_STATIC_CDN_ENDPOINT
          value: https://chat.turtton.net
        - name: FLUXER_MEDIA_PROXY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fluxer-runtime-keys
              key: media_proxy_secret_key
