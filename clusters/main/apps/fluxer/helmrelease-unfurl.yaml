---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-unfurl
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/fluxer/current/fluxer-svc
      version: 0.1.0
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
      reconcileStrategy: Revision
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
  # Preserve existing immutable selectors and Helm-owned PDB names.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: unfurl
            patch: |-
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app: unfurl
              - op: add
                path: /spec/template/metadata/labels/app
                value: unfurl
              - op: add
                path: /spec/template/metadata/labels/app.kubernetes.io~1version
                value: v1
              - op: add
                path: /metadata/labels/app.kubernetes.io~1version
                value: v1
              - op: replace
                path: /spec/template/metadata/labels/app.kubernetes.io~1name
                value: unfurl
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1name
                value: unfurl
          - target:
              kind: StatefulSet
              name: unfurl-shard
            patch: |-
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app: unfurl-shard
              - op: add
                path: /spec/template/metadata/labels/app
                value: unfurl-shard
              - op: add
                path: /spec/template/metadata/labels/app.kubernetes.io~1version
                value: v1
              - op: add
                path: /metadata/labels/app.kubernetes.io~1version
                value: v1
              - op: replace
                path: /spec/template/metadata/labels/app.kubernetes.io~1name
                value: unfurl
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1name
                value: unfurl
          - target:
              kind: Service
              name: unfurl
            patch: |-
              - op: replace
                path: /spec/selector
                value:
                  app: unfurl
          - target:
              kind: Service
              name: unfurl-shard-headless
            patch: |-
              - op: replace
                path: /spec/selector
                value:
                  app: unfurl-shard
          - target:
              kind: PodDisruptionBudget
              name: unfurl-pdb
            patch: |-
              - op: replace
                path: /metadata/name
                value: unfurl
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app: unfurl
          - target:
              kind: PodDisruptionBudget
              name: unfurl-shard-pdb
            patch: |-
              - op: replace
                path: /metadata/name
                value: unfurl-shard
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app: unfurl-shard
    # Keep Pod templates stable when infra main changes without chart changes.
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: "(Deployment|StatefulSet)"
            patch: |-
              - op: replace
                path: /spec/template/metadata/labels/helm.sh~1chart
                value: fluxer-svc-0.1.0
  values:
    image:
      registry: ghcr.io/fluxerapp
      tag: v1
    # Clear upstream defaults before restoring the running service configuration.
    env: null
    envFrom: []
    # The old default ghcr-pull-secret does not exist; these GHCR images are public.
    imagePullSecrets: []
    extraEnv:
      - name: FLUXER_SVC_NATS_URL
        value: nats://nats.fluxer.svc.cluster.local:4222
      - name: FLUXER_SVC_CACHE_MAX_ENTRIES
        value: '250000'
      - name: FLUXER_SVC_CACHE_TTL_MS
        value: '1800000'
      - name: FLUXER_MEDIA_PROXY_ENDPOINT
        value: http://media-proxy:8080
      - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
        value: https://chat.turtton.net/media
      - name: FLUXER_STATIC_CDN_ENDPOINT
        value: https://chat.turtton.net
      - name: FLUXER_MEDIA_PROXY_SECRET_KEY
        valueFrom:
          secretKeyRef:
            key: media_proxy_secret_key
            name: fluxer-runtime-keys
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '8090'
      prometheus.io/path: /_metrics
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    probes:
      startup: null
      liveness:
        httpGet:
          path: /_healthz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 15
      readiness:
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 1
        periodSeconds: 5
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    port: 8090
    router:
      replicas: 1
      minReadySeconds: 10
      terminationGracePeriodSeconds: 60
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      pdb:
        minAvailable: 75%
    shard:
      replicas: 1
      minReadySeconds: 10
      terminationGracePeriodSeconds: 60
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      pdb:
        minAvailable: 75%
      extraEnv:
        - name: FLUXER_SVC_MAX_CONCURRENT_REQUESTS
          value: '64'
      podSecurityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      probes:
        startup:
          httpGet:
            path: /_healthz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 5
          failureThreshold: 60
        liveness:
          httpGet:
            path: /_healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 3
        readiness:
          httpGet:
            path: /_health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
      updateStrategy:
        type: RollingUpdate
    # Each HelmRelease continues to own only its existing service and shard.
    services:
      gifs: null
      messages: null
      snowflakes: null
      unfurl:
        # Pin the currently running image while changing the chart layout.
        image:
          name: fluxer-unfurl
          digest: sha256:cabbfb92b36eac2b0b31e126a446af54f00e3076eba2734271539f5787aeddbb
        shard:
          env: null
      users: null
