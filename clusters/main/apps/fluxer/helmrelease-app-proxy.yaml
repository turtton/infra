---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-app-proxy
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/fluxer/current/fluxer-web
      version: 0.1.0
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
      reconcileStrategy: Revision
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
  values:
    # Keep the running application version while migrating the chart layout.
    image:
      registry: ghcr.io/fluxerapp
      tag: v1
    # Disable upstream example endpoints and the default fluxer-env Secret.
    env: null
    envFrom: []
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    probes:
      startup: null
      liveness:
        failureThreshold: 3
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
      readiness:
        failureThreshold: 2
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - toliworker-1
                    - toliworker-2
                    - toliworker-3
    topologySpreadConstraints:
      - maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
    workloads:
      app-proxy:
        image:
          name: fluxer-app-proxy-self-hosted
          digest: sha256:f4b30ceb39d8696932d89ce69cd3fa537e52757de34347256d896cf335393299
        replicas: 1
        minReadySeconds: 10
        terminationGracePeriodSeconds: 60
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env: null
        extraEnv:
          - name: NODE_ENV
            value: production
          - name: FLUXER_ENV
            value: production
          - name: BUILD_VERSION
            value: v1
          - name: PUBLIC_BOOTSTRAP_API_ENDPOINT
            value: /api
          - name: PUBLIC_BOOTSTRAP_API_PUBLIC_ENDPOINT
            value: https://chat.turtton.net/api
          - name: DISCOVERY_UPSTREAM_URL
            value: http://caddy:80/.well-known/fluxer
        extraVolumeMounts:
          - mountPath: /etc/fluxer/keys
            name: keys
            readOnly: true
        extraVolumes:
          - name: keys
            secret:
              optional: true
              secretName: fluxer-keys
        pdb:
          minAvailable: 50%
      admin: null
  postRenderers:
    # Keep Pod templates stable when infra main changes without chart changes.
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: "(Deployment|StatefulSet)"
            patch: |-
              - op: replace
                path: /spec/template/metadata/labels/helm.sh~1chart
                value: fluxer-web-0.1.0
