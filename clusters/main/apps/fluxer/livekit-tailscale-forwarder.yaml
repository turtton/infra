---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-tailscale-forwarder
  namespace: fluxer
  labels:
    app: livekit-tailscale-forwarder
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: livekit-tailscale-forwarder
  template:
    metadata:
      labels:
        app: livekit-tailscale-forwarder
    spec:
      serviceAccountName: livekit-tailscale
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - toliworker-1
                      - toliworker-2
                      - toliworker-3
      containers:

        - name: socat-turn
          image: alpine/socat:1.8.0.1
          imagePullPolicy: IfNotPresent
          command:
            - socat
          args:
            - TCP-LISTEN:5349,fork,reuseaddr
            - TCP:livekit-turn.fluxer.svc.cluster.local:443
          ports:
            - name: turn-tls
              containerPort: 5349
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        - name: tailscale
          image: tailscale/tailscale:v1.82.0
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |-
              tailscaled --tun=userspace-networking --state=kube:tailscale-livekit-state --socket=/tmp/tailscaled.sock &
              sleep 5
              tailscale --socket=/tmp/tailscaled.sock up \
                --authkey="${TS_AUTHKEY}" \
                --hostname=livekit-media
              sleep 3
              tailscale --socket=/tmp/tailscaled.sock funnel --tcp 443 tcp://127.0.0.1:5349 &
              wait
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-livekit-auth
                  key: TS_AUTHKEY
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-tailscale-forwarder
  namespace: fluxer
  labels:
    app: livekit-tailscale-forwarder
spec:
  type: ClusterIP
  selector:
    app: livekit-tailscale-forwarder
  ports:
    - name: turn-tls
      port: 5349
      targetPort: turn-tls
      protocol: TCP
