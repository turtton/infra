---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-messages
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/helm/messages
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: fluxer-upstream
        namespace: fluxer
      interval: 1h
  values:
    global:
      registry: ghcr.io/fluxerapp
      namespace: fluxer

    svc:
      name: messages
      image: fluxer-messages
      tag: v1
      nats:
        url: nats://nats.fluxer.svc.cluster.local:4222
      shard:
        replicas: 1
      router:
        replicas: 1
      extraEnv:
        - name: FLUXER_POSTGRES_HOST
          value: fluxer-db-rw.fluxer.svc.cluster.local
        - name: FLUXER_POSTGRES_PORT
          value: "5432"
        - name: FLUXER_POSTGRES_DATABASE
          value: fluxer
        - name: FLUXER_POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: fluxer-db-app
              key: username
        - name: FLUXER_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluxer-db-app
              key: password
        - name: FLUXER_POSTGRES_SSL
          value: "true"
        - name: FLUXER_POSTGRES_SSL_CA
          valueFrom:
            secretKeyRef:
              name: fluxer-db-ca
              key: ca.crt
