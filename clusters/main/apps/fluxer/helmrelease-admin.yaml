---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxer-admin
  namespace: fluxer
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/fluxer/current/fluxer-web
      version: 0.1.0
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
      reconcileStrategy: Revision
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
  values:
    # Keep the running application version while migrating the chart layout.
    image:
      registry: ghcr.io/fluxerapp
      tag: v1
    # Disable upstream example endpoints and the default fluxer-env Secret.
    env: null
    envFrom: []
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    probes:
      startup:
        failureThreshold: 24
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
      liveness:
        failureThreshold: 3
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
      readiness:
        failureThreshold: 2
        httpGet:
          path: /_health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - toliworker-1
                    - toliworker-2
                    - toliworker-3
    topologySpreadConstraints:
      - maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
    workloads:
      admin:
        image:
          name: fluxer-admin
          digest: sha256:280575da058284663daf5c8ca7593f9faef36e062dea36d510c26f4f698e5a6e
        replicas: 1
        minReadySeconds: 10
        terminationGracePeriodSeconds: 60
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env: null
        extraEnv:
          - name: NODE_ENV
            value: production
          - name: FLUXER_ENV
            value: production
          - name: BUILD_VERSION
            value: v1
          - name: FLUXER_ADMIN_BASE_PATH
            value: /admin
          - name: FLUXER_API_ENDPOINT
            value: http://api.fluxer.svc.cluster.local:8080
          - name: FLUXER_ADMIN_ENDPOINT
            value: https://chat.turtton.net/admin
          - name: FLUXER_APP_ENDPOINT
            value: https://chat.turtton.net
          - name: FLUXER_MEDIA_ENDPOINT
            value: https://chat.turtton.net/media
          - name: FLUXER_TRUST_CLIENT_IP_HEADER
            value: 'true'
          - name: FLUXER_CLIENT_IP_HEADER_NAME
            value: x-forwarded-for
          - name: FLUXER_ADMIN_SECRET_KEY_BASE
            valueFrom:
              secretKeyRef:
                key: admin_secret_key_base
                name: fluxer-runtime-keys
          - name: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                key: admin_oauth_client_secret
                name: fluxer-runtime-keys
        extraVolumeMounts:
          - mountPath: /etc/fluxer/keys
            name: keys
            readOnly: true
        extraVolumes:
          - name: keys
            secret:
              optional: true
              secretName: fluxer-keys
        pdb:
          minAvailable: 50%
      app-proxy: null
  postRenderers:
    # Keep Pod templates stable when infra main changes without chart changes.
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: "(Deployment|StatefulSet)"
            patch: |-
              - op: replace
                path: /spec/template/metadata/labels/helm.sh~1chart
                value: fluxer-web-0.1.0
