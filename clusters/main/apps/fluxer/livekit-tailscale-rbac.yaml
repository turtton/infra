---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: livekit-tailscale
  namespace: fluxer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livekit-tailscale-secret
  namespace: fluxer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-livekit-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livekit-tailscale-secret
  namespace: fluxer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: livekit-tailscale-secret
subjects:
  - kind: ServiceAccount
    name: livekit-tailscale
    namespace: fluxer
