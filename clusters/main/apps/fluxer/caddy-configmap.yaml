---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: fluxer
data:
  Caddyfile: |
    :80 {
        @notSW not path /sw.js
        encode @notSW zstd gzip

        handle /_health {
            respond "OK" 200
        }

        handle_path /api/* {
            reverse_proxy fluxer-server:8080
        }

        handle /gateway {
            rewrite * /
            reverse_proxy fluxer-server:8080
        }

        handle_path /gateway/* {
            reverse_proxy fluxer-server:8080
        }

        handle_path /media/* {
            reverse_proxy fluxer-server:8080
        }

        handle /admin {
            rewrite * /
            reverse_proxy fluxer-server:8080
        }

        handle_path /admin/* {
            reverse_proxy fluxer-server:8080
        }

        handle /.well-known/* {
            reverse_proxy fluxer-server:8080
        }

        handle /sw.js {
            header Cache-Control "no-cache, no-store"
            header CDN-Cache-Control "no-cache"
            reverse_proxy fluxer-server:8080
        }

        handle {
            reverse_proxy fluxer-server:8080
        }
    }

    :8088 {
        handle_path /api/* {
            reverse_proxy api:8080
        }
    }
