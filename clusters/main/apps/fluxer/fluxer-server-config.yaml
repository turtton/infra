---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxer-server-config
  namespace: fluxer
data:
  config.json: |
    {
      "env": "production",
      "domain": {
        "base_domain": "chat.turtton.net",
        "public_scheme": "https",
        "public_port": 443
      },
      "database": {
        "backend": "sqlite",
        "sqlite_path": "/usr/src/app/data/fluxer.db"
      },
      "internal": {
        "kv": "redis://valkey.fluxer.svc.cluster.local:6379/0",
        "kv_mode": "standalone"
      },
      "s3": {
        "access_key_id": "fluxer-local",
        "secret_access_key": "fluxer-local-secret",
        "endpoint": "http://127.0.0.1:8080/s3"
      },
      "instance": {
        "self_hosted": true,
        "deployment_mode": "monolith"
      },
      "services": {
        "server": {
          "host": "0.0.0.0",
          "port": 8080
        },
        "s3": {
          "data_dir": "/usr/src/app/data/s3"
        },
        "queue": {
          "data_dir": "/usr/src/app/data/queue"
        },
        "media_proxy": {
          "secret_key": "placeholder-overridden-by-env"
        },
        "admin": {
          "secret_key_base": "placeholder-overridden-by-env",
          "oauth_client_secret": "placeholder-overridden-by-env"
        },
        "marketing": {
          "enabled": false
        },
        "gateway": {
          "port": 8082,
          "admin_reload_secret": "placeholder-overridden-by-env",
          "media_proxy_endpoint": "http://127.0.0.1:8080/media"
        },
        "nats": {
          "core_url": "nats://nats.fluxer.svc.cluster.local:4222",
          "jetstream_url": "nats://nats.fluxer.svc.cluster.local:4222"
        }
      },
      "auth": {
        "sudo_mode_secret": "placeholder-overridden-by-env",
        "connection_initiation_secret": "placeholder-overridden-by-env",
        "vapid": {
          "public_key": "placeholder-overridden-by-env",
          "private_key": "placeholder-overridden-by-env",
          "email": "noreply@chat.turtton.net"
        }
      },
      "integrations": {
        "search": {
          "engine": "meilisearch",
          "url": "http://meilisearch.fluxer.svc.cluster.local:7700",
          "api_key": "placeholder-overridden-by-env"
        },
        "email": {
          "enabled": false,
          "provider": "none"
        },
        "captcha": {
          "enabled": false,
          "provider": "none"
        },
        "voice": {
          "enabled": false
        },
        "gif": {
          "provider": "tenor"
        },
        "clamav": {
          "enabled": false
        },
        "ncmec": {
          "enabled": false
        },
        "stripe": {
          "enabled": false
        }
      },
      "proxy": {
        "trust_client_ip_header": true,
        "client_ip_header": "x-forwarded-for"
      },
      "discovery": {
        "enabled": true,
        "min_member_count": 1
      }
    }
