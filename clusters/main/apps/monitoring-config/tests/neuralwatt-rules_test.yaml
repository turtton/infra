      - series: 'neuralwatt_monthly_budget_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "20x600"
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "20x600"
      - series: 'neuralwatt_usage_cost_usd_total{window="lifetime", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "243.9145x600"
    alert_rule_test:
      - eval_time: 10m
        alertname: NeuralwattMonthlyBudgetUsage
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattMonthlyBudgetUsage", severity: "critical", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の当月の費用が予算に到達 (100%)"
              description: "当月の費用は 20.00 USD で、月の予算 20.00 USD の 100% (100% 以上)。\n段階 2 の運用では停止線。利用の停止または予算の見直しを判断すること。"
          - exp_labels: {alertname: "NeuralwattMonthlyBudgetUsage", severity: "critical", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-b", instance: "10.0.0.2:8080"}
            exp_annotations:
              summary: "Neuralwatt の当月の費用が予算に到達 (100%)"
              description: "当月の費用は 20.00 USD で、月の予算 20.00 USD の 100% (100% 以上)。\n段階 2 の運用では停止線。利用の停止または予算の見直しを判断すること。"

  # 1 時間に 2.4 ドル (0.04 ドル/分) の増加: 発火する (for 0m)。90m の累計 3.60 ドル、予算 20 ドルに対し 18.0%
  - name: burn-rate-high
    interval: 1m
    input_series:
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+0.04x600"
      - series: 'neuralwatt_monthly_budget_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "20x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - eval_time: 90m
        alertname: NeuralwattCostBurnRateHigh
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattCostBurnRateHigh", severity: "warning", window: "current_month", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の費用が急増 (直近 1 時間で 2.40 USD)"
              description: "Neuralwatt の費用が直近 1 時間で 2.40 USD 増えた (閾値 2 USD)。\n当月の累計: 3.60 USD、月の予算に対する割合: 18.0%。\nエージェントの暴走・ループの可能性。dsh-agent の状態を確認すること。"

  # 予算の系列が無くても説明文はエラーにならず、割合は「不明 (予算が未設定)」
  - name: burn-rate-high-no-budget
    interval: 1m
    input_series:
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+0.04x600"
    alert_rule_test:
      - eval_time: 90m
        alertname: NeuralwattCostBurnRateHigh
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattCostBurnRateHigh", severity: "warning", window: "current_month", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の費用が急増 (直近 1 時間で 2.40 USD)"
              description: "Neuralwatt の費用が直近 1 時間で 2.40 USD 増えた (閾値 2 USD)。\n当月の累計: 3.60 USD、月の予算に対する割合: 不明 (予算が未設定)。\nエージェントの暴走・ループの可能性。dsh-agent の状態を確認すること。"

  # 1 時間に約 1.9 ドル (0.032 ドル/分) の増加: 閾値 2 ドルの手前で発火しない
  - name: burn-rate-below
    interval: 1m
    input_series:
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+0.032x600"
    alert_rule_test:
      - {eval_time: 90m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}

  # lifetime の系列の急増は対象外 (current_month のみ)
  - name: burn-rate-lifetime-ignored
    interval: 1m
    input_series:
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
      - series: 'neuralwatt_usage_cost_usd_total{window="lifetime", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+1x600"
    alert_rule_test:
      - {eval_time: 90m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}

  # キーの残り 2/10 (20%): 境界。< 0.2 なので発火しない
  - name: key-allowance-20pct-none
    interval: 1m
    input_series:
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "2x600"
      - series: 'neuralwatt_key_allowance_spent_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "8x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattKeyAllowanceLow, exp_alerts: []}
      - {eval_time: 30m, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # キーの残り 1.99/10: 10 分後に発火 (9 分では発火しない)。説明文の残り 1.99 / 上限 10.00 USD と 19.9%
  - name: key-allowance-below-20pct
    interval: 1m
    input_series:
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1.99x600"
      - series: 'neuralwatt_key_allowance_spent_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "8.01x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 9m, alertname: NeuralwattKeyAllowanceLow, exp_alerts: []}
      - eval_time: 10m
        alertname: NeuralwattKeyAllowanceLow
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyAllowanceLow", severity: "warning", key_name: "my-production-key", period: "monthly", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キー (my-production-key) の上限の残りが 20% 未満"
              description: "API キー my-production-key (monthly) の上限の残りは 19.9% (20% 未満)。\n残り 1.99 USD / 上限 10.00 USD。上限に達するとキーが止まる (402)。"
      - {eval_time: 30m, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # キーが止まっている (blocked=1、残り 0、使用 10): KeyBlocked が即発火 (for 0m)。説明文は使用 10.00 / 上限 10.00 USD。Low は blocked==0 の条件で発火しない
  - name: key-blocked
    interval: 1m
    input_series:
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_key_allowance_spent_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
    alert_rule_test:
      - eval_time: 0m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", key_name: "my-production-key", period: "monthly", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "API キー my-production-key (monthly) が上限に達してブロックされている (使用 10.00 USD / 上限 10.00 USD)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
      - {eval_time: 30m, alertname: NeuralwattKeyAllowanceLow, exp_alerts: []}

  # blocked=1 だけで使用・上限の系列が無い: 説明文はエラーにならず「使用 不明 USD / 上限 不明 USD」
  - name: key-blocked-no-spent-limit
    interval: 1m
    input_series:
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
    alert_rule_test:
      - eval_time: 0m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", key_name: "my-production-key", period: "monthly", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "API キー my-production-key (monthly) が上限に達してブロックされている (使用 不明 USD / 上限 不明 USD)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"

  # キーの上限の系列が無い (上限なし): 0 扱いにせず Low・Blocked は発火しない
  - name: key-absent
    interval: 1m
    input_series:
      - series: 'up{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattKeyAllowanceLow, exp_alerts: []}
      - {eval_time: 30m, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # 新旧 2 つの target (pod ラベルが違う) でキーの割り算が 1 対 1 に照合され評価エラーにならず、target ごとに 1 件ずつ発火する。説明文の残り・上限は alert と同じ pod の系列 (旧: 1/10、新: 3/20 ドルで上限も違う)
  - name: key-two-targets
    interval: 1m
    input_series:
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
      - series: 'neuralwatt_key_allowance_spent_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "9x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "20x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "3x600"
      - series: 'neuralwatt_key_allowance_spent_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "17x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-b", instance="10.0.0.2:8080"}'
        values: "0x600"
    alert_rule_test:
      - eval_time: 10m
        alertname: NeuralwattKeyAllowanceLow
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyAllowanceLow", severity: "warning", key_name: "my-production-key", period: "monthly", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キー (my-production-key) の上限の残りが 20% 未満"
              description: "API キー my-production-key (monthly) の上限の残りは 10% (20% 未満)。\n残り 1.00 USD / 上限 10.00 USD。上限に達するとキーが止まる (402)。"
          - exp_labels: {alertname: "NeuralwattKeyAllowanceLow", severity: "warning", key_name: "my-production-key", period: "monthly", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-b", instance: "10.0.0.2:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キー (my-production-key) の上限の残りが 20% 未満"
              description: "API キー my-production-key (monthly) の上限の残りは 15% (20% 未満)。\n残り 3.00 USD / 上限 20.00 USD。上限に達するとキーが止まる (402)。"

  # 402 (payment_required) の増加: 増えた直後 (3m) から、増加が 10 分の窓に入る間 (11m) は発火する。窓を外れる (13m) と発火しない。説明文は 402 を返した旨
  - name: payment-required-increase
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetches_total{result="payment_required", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x2 1x600"
    alert_rule_test:
      - {eval_time: 2m, alertname: NeuralwattKeyBlocked, exp_alerts: []}
      - eval_time: 3m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", result: "payment_required", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "Neuralwatt が 402 (payment_required) を返した (直近 10 分)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
      - eval_time: 11m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", result: "payment_required", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "Neuralwatt が 402 (payment_required) を返した (直近 10 分)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
      - {eval_time: 13m, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # payment_required 以外の取得エラー (unauthorized) が増えても KeyBlocked は発火しない (FetchFailing の範囲)
  - name: other-fetch-errors-ignored
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetches_total{result="unauthorized", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+1x600"
      - series: 'neuralwatt_exporter_fetches_total{result="payment_required", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattKeyBlocked, exp_alerts: []}
