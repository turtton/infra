  # 取得 15 分間隔: 失敗 (21 サンプル) の間に成功 (1 サンプル) が挟まれば累積しない (どちらの失敗も for 40m に届かない)
  - name: fetch-failing-poll15-recovery-between
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x9 0x20 1 0x20 1x200"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1000x300"
    alert_rule_test:
      - {eval_time: 40m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - {eval_time: 50m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - {eval_time: 52m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - {eval_time: 55m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}

  # 取得 15 分間隔で 402 が続く (カウンタが 3m・18m・33m・48m に 1 ずつ増える): 窓 35 分で途切れず (毎分)、最後の増加 (48m) の 33 分後 (81m) まで発火し、82m に解消する (窓が 10 分だと 15 分ごとに解消してフラップした)
