# neuralwatt-rules.yaml (PrometheusRule `neuralwatt`) の promtool ルールテスト。
# Flux の対象外 (monitoring-config/kustomization.yaml の resources に含めない)。CI (flux-check.yml) は
# このテストを実行しない。規則を変えたらローカルで実行して通すこと。
#
# promtool は CRD の YAML を読めないため、本番 YAML の .spec を一時ディレクトリに同名ファイルで抽出し、
# このファイルと同じディレクトリに置いて実行する (rule_files はその同名ファイルを指す)。
#
#   cd clusters/main/apps/monitoring-config
#   tmpdir=$(mktemp -d)
#   yq '.spec' neuralwatt-rules.yaml > "$tmpdir/neuralwatt-rules.yaml"
#   cp tests/neuralwatt-rules_test.yaml "$tmpdir/"
#   promtool test rules "$tmpdir/neuralwatt-rules_test.yaml"
#   # promtool が無ければ: docker run --rm -v "$tmpdir:/work:ro" -w /work --entrypoint promtool \
#   #   prom/prometheus:v3.5.0 test rules neuralwatt-rules_test.yaml
#
# 入力の系列の名前・ラベルは Lepinoid/infra neuralwatt-exporter の契約 (testdata/metrics.golden・
# deployment.yaml) どおり。PodMonitor が付ける job・namespace・pod・instance も入れている。
# 評価間隔・系列の間隔は 1m (exporter の取得間隔は 15 分なので、取得で変わる系列は 15 サンプルごとに値が変わる階段状。
# 失敗は 0 の連続: 取得 1 回 ≒ 15〜16 サンプル、2 回 ≒ 31、3 回 ≒ 46)。アラートは、条件を満たした最初の評価から for の時間が経った評価で発火する。
# time() は評価時刻の秒数 (評価時刻 360m = 21600 秒 = 6 時間)。
# exp_annotations は promtool が annotations の一致も検査するために必要。説明文は query テンプレートで実際の指標から
# 計算する (turtton/infra#197)。期待値は、入力の数値から実装とは独立に組み立てた文言で、計算結果 (比率・USD・時刻・
# 経過時間) と、指標が無いときの「不明」の表示を検証する。query が同じ namespace・pod・instance の系列だけを引くこと、
# 名前のないキー (key_name=""。ラベル無しで出る) の表示も検証する。
rule_files:
  - neuralwatt-rules.yaml

evaluation_interval: 30s

tests:
  # 取得できているとき: どのアラートも発火しない (last_success は評価時刻 500m=30000 秒の 100 秒前)
  - name: healthy-exporter-fires-nothing
    interval: 1m
    input_series:
      - series: 'up{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "29900x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_credits_remaining_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "32.6774x600"
      - series: 'neuralwatt_credits_total_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "52.34x600"
      - series: 'neuralwatt_monthly_budget_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "20x600"
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1.5x600"
      - series: 'neuralwatt_usage_cost_usd_total{window="lifetime", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "243.9145x600"
      - series: 'neuralwatt_key_allowance_limit_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10x600"
      - series: 'neuralwatt_key_allowance_remaining_usd{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "8.25x600"
      - series: 'neuralwatt_key_allowance_blocked{key_name="my-production-key", period="monthly", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_fetches_total{result="ok", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0+1x600"
      - series: 'neuralwatt_exporter_fetches_total{result="payment_required", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 500m, alertname: NeuralwattExporterDown, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattExporterAbsent, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattCreditsLow, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattCreditsCritical, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattMonthlyBudgetUsage, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattKeyAllowanceLow, exp_alerts: []}
      - {eval_time: 500m, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # scrape の失敗 (up=0): 10 分続くと発火、9 分では発火しない。Absent は up の系列があるので発火しない
  - name: exporter-down
    interval: 1m
    input_series:
      - series: 'up{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 9m, alertname: NeuralwattExporterDown, exp_alerts: []}
      - eval_time: 10m
        alertname: NeuralwattExporterDown
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattExporterDown", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "neuralwatt-exporter の scrape に失敗 (nw-a)"
              description: "Prometheus が neuralwatt-exporter (nw-a, 10.0.0.1:8080) の scrape に 10 分以上失敗している。\nPod の状態 (kubectl -n lepinoid get pods -l app.kubernetes.io/name=neuralwatt-exporter) と NetworkPolicy を確認すること。"
      - {eval_time: 30m, alertname: NeuralwattExporterAbsent, exp_alerts: []}

  # up=1 なら Down は発火しない
  - name: exporter-up-no-down
    interval: 1m
    input_series:
      - series: 'up{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattExporterDown, exp_alerts: []}
      - {eval_time: 30m, alertname: NeuralwattExporterAbsent, exp_alerts: []}

  # target が無い (up の系列が無い): 15 分続くと発火、14 分では発火しない。別の job の up は無関係
  - name: exporter-absent
    interval: 1m
    input_series:
      - series: 'up{job="other", namespace="monitoring", pod="x", instance="1.1.1.1:1"}'
        values: "1x600"
    alert_rule_test:
      - {eval_time: 14m, alertname: NeuralwattExporterAbsent, exp_alerts: []}
      - eval_time: 15m
        alertname: NeuralwattExporterAbsent
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattExporterAbsent", severity: "warning", job: "neuralwatt-exporter"}
            exp_annotations:
              summary: "neuralwatt-exporter の target が存在しない"
              description: "job=neuralwatt-exporter の target が 15 分以上存在しない。\nexporter の Pod が無い、または PodMonitor (monitoring/neuralwatt-exporter) のラベル・ポート名が Deployment と食い違っている可能性。"

  # 取得の失敗 (fetch_success=0、up=1 のまま、一度も成功していない): 40 分続くと発火、39 分では発火しない (取得間隔 15 分の 3 回連続の失敗に相当)。Down は発火しない。説明文は「一度も取得に成功していない」
  - name: fetch-failing
    interval: 1m
    input_series:
      - series: 'up{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x600"
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 39m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - eval_time: 40m
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n一度も取得に成功していない。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"
      - {eval_time: 30m, alertname: NeuralwattExporterDown, exp_alerts: []}

  # 取得に失敗しているが成功したことがある (last_success=1000 秒): 説明文に最後の成功の時刻 (1970-01-01 00:16:40 UTC) が出る
  - name: fetch-failing-after-success
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1000x600"
    alert_rule_test:
      - eval_time: 40m
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n最後に成功した取得: 1970-01-01 00:16:40 +0000 UTC。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"

  # last_success の系列が無くても説明文はエラーにならず「一度も取得に成功していない」(query が空 → else)
  - name: fetch-failing-no-last-success-series
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - eval_time: 40m
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n一度も取得に成功していない。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"

  # 取得が回復 (fetch_success が 9 分後に 1 へ) すれば発火しない
  - name: fetch-failing-recovers
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x8 1x600"
    alert_rule_test:
      - {eval_time: 20m, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}

  # (a) 一度も成功していない (last_success=0) が起動直後 (失敗が続いている): Stale は発火しない。FetchFailing は発火する
  - name: stale-a-never-succeeded-just-started
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 5m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - {eval_time: 359m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - eval_time: 40m
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n一度も取得に成功していない。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"

  # (b) 0 のまま起動から 6 時間: ちょうど 6 時間 (360m) では発火せず、超えると (361m) 発火する (for 0m)。説明文は起動からの経過 6h 1m 0s
  - name: stale-b-never-succeeded-6h
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 360m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - eval_time: 361m
        alertname: NeuralwattQuotaStale
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaStale", severity: "critical", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量が 6 時間以上更新されていない (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に成功しないまま 6 時間を超えた。\n一度も成功していない (exporter の起動から 6h 1m 0s)。\nダッシュボードとほかのアラートは古い値で動いているため、残高・費用の判断に使わないこと。API キーと Neuralwatt 側の状態を確認する。"

  # (b) 猶予は起動時刻から数える (起動 10000 秒): 起動から 6 時間ちょうど以前 (526m) では発火せず、527m に発火する。説明文の経過は 6h 0m 20s
  - name: stale-b-never-succeeded-later-start
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "10000x600"
    alert_rule_test:
      - {eval_time: 500m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - {eval_time: 526m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - eval_time: 527m
        alertname: NeuralwattQuotaStale
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaStale", severity: "critical", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量が 6 時間以上更新されていない (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に成功しないまま 6 時間を超えた。\n一度も成功していない (exporter の起動から 6h 0m 20s)。\nダッシュボードとほかのアラートは古い値で動いているため、残高・費用の判断に使わないこと。API キーと Neuralwatt 側の状態を確認する。"

  # (c) 最後の成功が 6 時間前ちょうど (成功 3600 秒、評価 420m=25200 秒) では発火せず、1 分後 (421m) に発火する。process_start が古くても成功時刻で判断する。説明文は最後の成功の時刻と経過 6h 1m 0s
  - name: stale-c-succeeded-before
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "3600x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 419m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - {eval_time: 420m, alertname: NeuralwattQuotaStale, exp_alerts: []}
      - eval_time: 421m
        alertname: NeuralwattQuotaStale
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaStale", severity: "critical", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量が 6 時間以上更新されていない (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に成功しないまま 6 時間を超えた。\n最後の成功: 1970-01-01 01:00:00 +0000 UTC (6h 1m 0s前)。\nダッシュボードとほかのアラートは古い値で動いているため、残高・費用の判断に使わないこと。API キーと Neuralwatt 側の状態を確認する。"

  # 成功が最近 (経過 100 秒) なら、プロセスの起動が古くても Stale は発火しない (last_success が 0 でない)
  - name: stale-d-recent-success-old-process
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "29900x600"
      - series: 'process_start_time_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x600"
    alert_rule_test:
      - {eval_time: 500m, alertname: NeuralwattQuotaStale, exp_alerts: []}

  # 残高 5.00: 境界。Low は < 5 なので発火しない
  - name: credits-5.00-none
    interval: 1m
    input_series:
      - series: 'neuralwatt_credits_remaining_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "5x600"
      - series: 'neuralwatt_credits_total_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "31x600"
    alert_rule_test:
      - {eval_time: 30m, alertname: NeuralwattCreditsLow, exp_alerts: []}
