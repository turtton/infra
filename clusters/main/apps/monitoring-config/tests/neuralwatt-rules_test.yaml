      - {eval_time: 122m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 123m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 124m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 125m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 126m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 127m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 128m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 129m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 130m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 131m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 132m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 133m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 134m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}
      - {eval_time: 135m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}

  # 急増して止まる: 20m の取得で費用が 3 ドル増え、以後は増えない。1 時間の増加が窓から外れる 78m まで増加 3.00 ドル (カウンタが 0 から始まるので窓の端へは外挿されない) が続き、15 分の最大を取るので 92m (評価位相 30 秒の 92m30s も) まで発火し、93m に解消する
  - name: burn-rate-poll15-burst-then-stop
    interval: 1m
    input_series:
      - series: 'neuralwatt_usage_cost_usd_total{window="current_month", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x19 3x200"
      - series: 'neuralwatt_monthly_budget_usd{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "20x300"
    alert_rule_test:
      - eval_time: 78m
        alertname: NeuralwattCostBurnRateHigh
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattCostBurnRateHigh", severity: "warning", window: "current_month", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の費用が急増 (1 時間の増加が最大 3.00 USD)"
              description: "Neuralwatt の費用の 1 時間あたりの増加量 (直近 15 分間の推定最大値) が 3.00 USD になった (閾値 2 USD)。\n当月の累計: 3.00 USD、月の予算に対する割合: 15.0%。\nエージェントの暴走・ループの可能性。dsh-agent の状態を確認すること。"
      - eval_time: 92m
        alertname: NeuralwattCostBurnRateHigh
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattCostBurnRateHigh", severity: "warning", window: "current_month", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の費用が急増 (1 時間の増加が最大 3.00 USD)"
              description: "Neuralwatt の費用の 1 時間あたりの増加量 (直近 15 分間の推定最大値) が 3.00 USD になった (閾値 2 USD)。\n当月の累計: 3.00 USD、月の予算に対する割合: 15.0%。\nエージェントの暴走・ループの可能性。dsh-agent の状態を確認すること。"
      - eval_time: 92m30s
        alertname: NeuralwattCostBurnRateHigh
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattCostBurnRateHigh", severity: "warning", window: "current_month", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の費用が急増 (1 時間の増加が最大 3.00 USD)"
              description: "Neuralwatt の費用の 1 時間あたりの増加量 (直近 15 分間の推定最大値) が 3.00 USD になった (閾値 2 USD)。\n当月の累計: 3.00 USD、月の予算に対する割合: 15.0%。\nエージェントの暴走・ループの可能性。dsh-agent の状態を確認すること。"
      - {eval_time: 93m, alertname: NeuralwattCostBurnRateHigh, exp_alerts: []}

  # 評価位相 30 秒 (評価間隔 30s): 3 回連続の失敗 (0 が 10m〜55m) は 50m に発火し、その 30 秒前 (49m30s) では発火せず、30 秒後 (50m30s) も発火している。for の境界が 30 秒刻みでも変わらない
  - name: fetch-failing-poll15-eval-phase-30s
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetch_success{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x9 0x45 1x200"
      - series: 'neuralwatt_exporter_last_success_timestamp_seconds{job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1000x300"
    alert_rule_test:
      - {eval_time: 49m30s, alertname: NeuralwattQuotaFetchFailing, exp_alerts: []}
      - eval_time: 50m
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n最後に成功した取得: 1970-01-01 00:16:40 +0000 UTC。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"
      - eval_time: 50m30s
        alertname: NeuralwattQuotaFetchFailing
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattQuotaFetchFailing", severity: "warning", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の残高・使用量の取得が失敗し続けている (nw-a)"
              description: "exporter が Neuralwatt の /v1/quota の取得に 40 分以上失敗している (up は 1 のまま)。\n最後に成功した取得: 1970-01-01 00:16:40 +0000 UTC。\n失敗の内訳は neuralwatt_exporter_fetches_total の result ラベル (unauthorized・payment_required・rate_limited など) で確認すること。この間、残高・費用の指標は最後に成功した値のまま。"

  # 評価位相 30 秒 (評価間隔 30s): 1 回だけの 402 (3m に増加) は 36m・36m30s まで発火し、37m・37m30s には解消している
  - name: payment-required-poll15-eval-phase-30s
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetches_total{result="payment_required", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "0x2 1x200"
    alert_rule_test:
      - eval_time: 36m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", result: "payment_required", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "Neuralwatt が 402 (payment_required) を返した (直近 35 分)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
      - eval_time: 36m30s
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", result: "payment_required", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "Neuralwatt が 402 (payment_required) を返した (直近 35 分)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
      - {eval_time: 37m, alertname: NeuralwattKeyBlocked, exp_alerts: []}
      - {eval_time: 37m30s, alertname: NeuralwattKeyBlocked, exp_alerts: []}

  # 初回の scrape の時点で 402 のカウンタがすでに 1 (Pod の起動直後の最初の取得が 402): increase は 1 サンプルだけでは 0 なので、この 1 回目の 402 では発火しない (既知の制約。FetchFailing が 40 分後に知らせ、取得 15 分後の 2 回目の 402 (カウンタ 2) で発火する)
  - name: payment-required-poll15-counter-already-1-at-first-scrape
    interval: 1m
    input_series:
      - series: 'neuralwatt_exporter_fetches_total{result="payment_required", job="neuralwatt-exporter", namespace="lepinoid", pod="nw-a", instance="10.0.0.1:8080"}'
        values: "1x14 2x200"
    alert_rule_test:
      - {eval_time: 5m, alertname: NeuralwattKeyBlocked, exp_alerts: []}
      - {eval_time: 14m, alertname: NeuralwattKeyBlocked, exp_alerts: []}
      - {eval_time: 14m30s, alertname: NeuralwattKeyBlocked, exp_alerts: []}
      - eval_time: 15m
        alertname: NeuralwattKeyBlocked
        exp_alerts:
          - exp_labels: {alertname: "NeuralwattKeyBlocked", severity: "critical", result: "payment_required", job: "neuralwatt-exporter", namespace: "lepinoid", pod: "nw-a", instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: "Neuralwatt の API キーが上限で止まっている (nw-a)"
              description: "Neuralwatt が 402 (payment_required) を返した (直近 35 分)。\nNeuralwatt のポータルでキーの上限・残高を確認すること。"
