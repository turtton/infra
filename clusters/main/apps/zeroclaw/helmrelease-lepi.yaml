---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zeroclaw-lepi
  namespace: zeroclaw
spec:
  interval: 30m
  chart:
    spec:
      chart: zeroclaw
      version: "0.1.21"
      sourceRef:
        kind: HelmRepository
        name: zeroclaw
        namespace: flux-system
  values:
    image:
      tag: "v0.6.8-debian"
    config:
      mode: daemon
      provider: github-copilot
      model: "claude-sonnet-4.6"
      allowPublicBind: false
      requirePairing: false
      memory:
        backend: sqlite
        autoSave: true
        embeddingProvider: "custom:https://api.voyageai.com/v1"
        embeddingModel: "voyage-4"
      agent:
        thinking:
          defaultLevel: high
        maxToolIterations: 100
        loopDetectionNoProgressThreshold: 10
        loopDetectionPingPongCycles: 5
        loopDetectionFailureStreak: 10
      autonomy:
        level: full
        workspaceOnly: false
        maxActionsPerHour: 1000
        allowedCommands: [git, curl, bash, env]
        shellEnvPassthrough: [GITHUB_TOKEN, GITHUB_REPO_URL, GITHUB_BASE_BRANCH]
      identity:
        format: openclaw
      channels:
        discord:
          enabled: true
          guildId: "719207321854541874"
          allowedUsers: ["275915497353117697"]
          listenToBots: false
      extraConfig: |
        [auth]
        provider = "github-copilot"
        mode = "token"

        [[memory.embedding_routes]]
        hint = "voyage"
        provider = "custom:https://api.voyageai.com/v1"
        model = "voyage-4"
        api_key_env = "VOYAGE_API_KEY"

        [agents.config-ops]
        provider = "github-copilot"
        model = "claude-sonnet-4.6"
        agentic = true
        max_iterations = 100
        agentic_timeout_secs = 600
        allowed_tools = ["file_read", "file_write", "shell", "web_search", "web_fetch", "git_operations"]
        skills_directory = "skills/config-ops"
        memory_namespace = "config-ops"
        system_prompt = "You are config-ops, a GitOps configuration management agent. Follow the instructions in your SKILL.md for workflow details."

        [agents.github-ops]
        provider = "github-copilot"
        model = "claude-sonnet-4.6"
        agentic = true
        max_iterations = 100
        agentic_timeout_secs = 600
        allowed_tools = ["file_read", "file_write", "shell", "web_search", "web_fetch", "git_operations"]
        skills_directory = "skills/github-ops"
        memory_namespace = "github-ops"
        system_prompt = "You are github-ops, a GitHub operations agent. Follow the instructions in your SKILL.md for workflow details."

        # NOTE: ZeroClaw does NOT support channel→agent routing.
        # Discord messages go to the main/default agent which delegates to github-ops when appropriate.

        [gateway.auth]
        mode = "token"
        allow_tailscale = true

        [messages]
        ack_reaction_scope = "group-mentions"

        [commands]
        native = "auto"
        native_skills = "auto"
        restart = true
        owner_display = "raw"

        [skills.install]
        node_manager = "bun"
    skillFiles:
      - name: config-ops
        configMapName: zeroclaw-config-ops-skill
        key: SKILL.md
      - name: github-ops
        configMapName: zeroclaw-github-ops-skill
        key: SKILL.md
    secret:
      create: false
      existingSecret: "zeroclaw-shared-secrets"
      existingSecretKey: "COPILOT_GITHUB_TOKEN"
    channelSecrets:
      create: false
      existingSecret: "zeroclaw-lepi-channel-secrets"
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn
    extraEnv:
      - name: GITHUB_REPO_URL
        value: "https://github.com/turtton/doumels.git"
      - name: GITHUB_BASE_BRANCH
        value: "main"
    extraEnvFrom:
      - secretRef:
          name: zeroclaw-shared-secrets
      - secretRef:
          name: zeroclaw-lepi-secrets
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
