---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroclaw-home
  namespace: zeroclaw
  annotations:
    tailscale.com/funnel: "false"
    tailscale.com/tags: "tag:zeroclaw"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: zeroclaw-home
      port:
        number: 3000
  tls:
    - hosts:
        - zeroclaw-home
