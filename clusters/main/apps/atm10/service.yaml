apiVersion: v1
kind: Service
metadata:
  name: atm10
  namespace: atm10
  annotations:
    tailscale.com/hostname: atm10
    tailscale.com/tags: "tag:atm10,tag:mcserver"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
  selector:
    app: atm10
