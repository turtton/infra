---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atm10
  namespace: atm10
  labels:
    app: atm10
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atm10
  template:
    metadata:
      labels:
        app: atm10
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: cache-cleanup
          image: alpine:latest
          command:
            - sh
            - -c
            - |-
              echo "Checking for empty/corrupt cache files..."
              find /data/.cache -type f -empty -name "*.json" -print -delete 2>/dev/null || true
              echo "Cache cleanup done"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: metrics
              containerPort: 19565
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: CF_SLUG
              value: all-the-mods-10
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atm10-secrets
                  key: CF_API_KEY
            - name: MEMORY
              value: "12G"
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "TRUE"
            - name: DIFFICULTY
              value: normal
            - name: ALLOW_FLIGHT
              value: "TRUE"
            - name: MOTD
              value: "%MODPACK_NAME%"
            - name: ICON
              value: https://media.forgecdn.net/avatars/thumbnails/1182/438/256/256/638755918649288941.png
            - name: OPS
              value: |-
                turtton
          resources:
            requests:
              cpu: 2
              memory: 10Gi
            limits:
              cpu: 4
              memory: 14Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - mainworker-1
            # mainworker-1 が使えない場合のフォールバック
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - toliworker-1
                      - toliworker-2
                      - toliworker-3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atm10-data
        - name: downloads
          persistentVolumeClaim:
            claimName: atm10-downloads
