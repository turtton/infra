apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-home-atm10-operator
  namespace: atm10
  labels:
    app: hermes-home
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-home-atm10-operator
  namespace: atm10
  labels:
    app: hermes-home
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-home-atm10-operator
subjects:
  - kind: ServiceAccount
    name: hermes-home
    namespace: hermes
