apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iceshrimp-web-egress
  namespace: iceshrimp
spec:
  podSelector:
    matchLabels:
      app: iceshrimp-web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: iceshrimp-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: iceshrimp-valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 100.89.111.33/32
      ports:
        - protocol: TCP
          port: 3128
