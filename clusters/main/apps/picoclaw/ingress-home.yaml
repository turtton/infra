---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: picoclaw-home
  namespace: picoclaw
  annotations:
    tailscale.com/funnel: "false"
    tailscale.com/tags: "tag:picoclaw"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: picoclaw-home
      port:
        number: 18800
  tls:
    - hosts:
        - picoclaw-home
