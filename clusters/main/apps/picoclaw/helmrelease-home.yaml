---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: picoclaw-home
  namespace: picoclaw
spec:
  interval: 30m
  chart:
    spec:
      chart: picoclaw
      version: "0.1.11"
      sourceRef:
        kind: HelmRepository
        name: picoclaw
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/turtton/picoclaw-copilot
      tag: latest
      pullPolicy: Always
    launcher:
      enabled: true
      image:
        repository: docker.io/sipeed/picoclaw
      port: 18800
      tokenSecret:
        existingSecret: "picoclaw-home-secrets"
        key: "PICOCLAW_LAUNCHER_TOKEN"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    config:
      agents:
        defaults:
          model_name: "kimi-k2.5"
          restrict_to_workspace: false
          max_tokens: 8192
          temperature: 0.7
          max_tool_iterations: 100
        list:
          - id: main
            default: true
            name: Main Assistant
          - id: config-ops
            name: Config Ops
      model_list:
        - model_name: "kimi-k2.5"
          model: "openrouter/moonshotai/kimi-k2.5"
      bindings: []
      channels:
        discord:
          enabled: true
          allow_from:
            - "275915497353117697"
            - "299106923741970432"
            - "280320003159490561"
          group_trigger:
            mention_only: true
      session:
        dm_scope: "per-channel-peer"
        backlog_limit: 20
      gateway:
        log_level: "info"
      tools:
        append_file:
          enabled: true
        edit_file:
          enabled: true
        read_file:
          enabled: true
        write_file:
          enabled: true
        list_dir:
          enabled: true
        exec:
          enabled: true
          allow_remote: true
        web:
          enabled: true
          brave:
            enabled: true
            max_results: 5
        web_fetch:
          enabled: true
        send_file:
          enabled: true
        spawn:
          enabled: true
        subagent:
          enabled: true
        message:
          enabled: true
        cron:
          enabled: true
        skills:
          enabled: true
        find_skills:
          enabled: true
        install_skill:
          enabled: true
        allow_read_paths: []
        allow_write_paths: []
      heartbeat:
        enabled: false
        interval: 30
    securitySecret:
      existingSecret: "picoclaw-home-security"
      key: "security.yml"
    skillFiles:
      config-ops:
        configMapName: picoclaw-config-ops-skill
        items:
          - key: SKILL.md
            path: SKILL.md
    extraEnv:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: picoclaw-home-secrets
            key: GITHUB_TOKEN
      - name: PICOCLAW_TOOLS_OPENCODE_TASK_ENABLED
        value: "true"
      - name: PICOCLAW_TOOLS_OPENCODE_TASK_SERVER_URL
        value: "http://localhost:4567"
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: placeholder
              spec:
                template:
                  spec:
                    initContainers:
                      - name: fetch-opencode-config
                        image: alpine/git:latest
                        command:
                          - sh
                          - -c
                          - |
                            set -eu
                            git clone --depth 1 https://github.com/turtton/dotnix.git /tmp/dotnix
                            SRC=/tmp/dotnix/home-manager/cli/dev/opencode
                            DEST=/opencode-config
                            cp "$SRC/opencode.jsonc" "$DEST/"
                            cp "$SRC/oh-my-openagent.json" "$DEST/"
                            cp "$SRC/AGENTS.md" "$DEST/"
                            mkdir -p "$DEST/skill/final-review" "$DEST/skill/git-commit"
                            cp "$SRC/skill/final-review/SKILL.md" "$DEST/skill/final-review/"
                            cp "$SRC/skill/final-review/GUIDE.md" "$DEST/skill/final-review/"
                            cp "$SRC/skill/git-commit/SKILL.md" "$DEST/skill/git-commit/"
                            cp "$SRC/skill/git-commit/GUIDE.md" "$DEST/skill/git-commit/"
                            rm -rf /tmp/dotnix
                        volumeMounts:
                          - name: opencode-config
                            mountPath: /opencode-config
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 256Mi
                    containers:
                      - name: opencode
                        image: ghcr.io/turtton/opencode:latest
                        imagePullPolicy: Always
                        args:
                          - serve
                          - --port
                          - "4567"
                          - --hostname
                          - 0.0.0.0
                        ports:
                          - name: opencode
                            containerPort: 4567
                            protocol: TCP
                        env:
                          - name: HOME
                            value: /root
                          - name: COPILOT_GITHUB_TOKEN
                            valueFrom:
                              secretKeyRef:
                                name: picoclaw-home-secrets
                                key: GITHUB_TOKEN
                        volumeMounts:
                          - name: opencode-config
                            mountPath: /root/.config/opencode
                        readinessProbe:
                          tcpSocket:
                            port: 4567
                          initialDelaySeconds: 30
                          periodSeconds: 10
                        livenessProbe:
                          tcpSocket:
                            port: 4567
                          initialDelaySeconds: 60
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 10m
                            memory: 128Mi
                          limits:
                            cpu: 500m
                            memory: 1Gi
                    volumes:
                      - name: opencode-config
                        emptyDir: {}
