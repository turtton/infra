---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-weekly-backup
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-weekly-backup
  namespace: nextcloud
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nextcloud-weekly-backup-state]
    verbs: [get, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [nextcloud]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [nextcloud]
    verbs: [get, update, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [nextcloud-db]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-weekly-backup
  namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-weekly-backup
subjects:
  - kind: ServiceAccount
    name: nextcloud-weekly-backup
    namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nextcloud-weekly-backup-pv-reader
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nextcloud-weekly-backup-pv-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nextcloud-weekly-backup-pv-reader
subjects:
  - kind: ServiceAccount
    name: nextcloud-weekly-backup
    namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-weekly-backup
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-weekly-backup
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-weekly-backup
subjects:
  - kind: ServiceAccount
    name: nextcloud-weekly-backup
    namespace: nextcloud
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-weekly-backup
  namespace: nextcloud
spec:
  # Sunday 04:00 JST, after the game-server backups on Friday.
  schedule: "0 4 * * 0"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed attempt is recovered by the watchdog; retrying a partly
      # completed snapshot pair under a new Pod identity is deliberately avoided.
      backoffLimit: 0
      activeDeadlineSeconds: 25200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-weekly-backup
        spec:
          serviceAccountName: nextcloud-weekly-backup
          restartPolicy: Never
          terminationGracePeriodSeconds: 360
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # The coordinator never mounts the file PVC; a short-lived keeper
          # Pod is removed and detached before Nextcloud is restarted.
          containers:
            - name: backup
              image: docker.io/alpine/k8s:1.35.3@sha256:097aa60cbef561146757c7494468e9d7b04d843597ad1a1515ed09d0708c8014
              command: [python3, /scripts/weekly-backup.py, run]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: nextcloud-weekly-backup-script
            - name: scratch
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup-recovery
  namespace: nextcloud
spec:
  # Also runs after abrupt Pod/node loss, when a process-level finally cannot run.
  schedule: "*/5 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 960
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-backup-recovery
        spec:
          serviceAccountName: nextcloud-weekly-backup
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recover
              image: docker.io/alpine/k8s:1.35.3@sha256:097aa60cbef561146757c7494468e9d7b04d843597ad1a1515ed09d0708c8014
              command: [python3, /scripts/weekly-backup.py, recover]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: nextcloud-weekly-backup-script
            - name: scratch
              emptyDir: {}
