apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners-trial
  namespace: ci-runners-trial
spec:
  hard:
    pods: "4"
    count/jobs.batch: "4"
    count/secrets: "4"
    requests.cpu: "12"
    limits.cpu: "12"
    requests.memory: 24Gi
    limits.memory: 24Gi
    requests.ephemeral-storage: 2Gi
    limits.ephemeral-storage: 8Gi
    persistentvolumeclaims: "4"
    requests.storage: 160Gi
