apiVersion: v1
kind: Namespace
metadata:
  name: ci-runners-trial
  labels:
    app.kubernetes.io/part-of: ci-runners-trial
    # Docker ジョブだけが専用 DinD sidecar を使う。ホストの socket は共有しない。
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: ci-runners-trial
automountServiceAccountToken: false
