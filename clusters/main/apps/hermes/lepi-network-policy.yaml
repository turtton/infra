---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-lepi-egress
  namespace: hermes
  labels:
    app: hermes-lepi
spec:
  podSelector:
    matchLabels:
      app: hermes-lepi
  policyTypes:
    - Egress
  egress:
    # External HTTPS (Discord, GitHub, Crof AI API, etc.)
    # Kubernetes API Server service (10.96.0.1:443) is translated to the
    # apiserver backend port 6443 by Cilium's kube-proxy replacement.
    # The egress rule must allow the translated port, not only 443.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # DNS resolution
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Other services within the namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
