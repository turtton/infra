# WARNING: This kustomization must ONLY reference files within this directory.
# Do NOT copy the parent apps/kustomization.yaml — it lists sibling app directories,
# which will cause "kustomize build failed" errors in Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - home-serviceaccount.yaml
  - home-rbac.yaml
  - home-network-policy.yaml
  - home-statefulset.yaml
  - lepi-serviceaccount.yaml
  - lepi-rbac.yaml
  - lepi-network-policy.yaml
  - lepi-statefulset.yaml
  - home-service.yaml
  - lepi-service.yaml
  - home-ingress.yaml
  - lepi-ingress.yaml
  - home-secrets.sops.yaml
  - lepi-secrets.sops.yaml
configMapGenerator:
  - name: hermes-home-config
    files:
      - config.yaml=home/config.yaml
  - name: hermes-lepi-config
    files:
      - config.yaml=lepi/config.yaml
  - name: hermes-config-ops-skill
    files:
      - SKILL.md=skills/config-ops/SKILL.md
  - name: hermes-github-ops-skill
    files:
      - SKILL.md=skills/github-ops/SKILL.md
  - name: hermes-fluxer-plugin
    files:
      - plugin.yaml=plugins/fluxer/plugin.yaml
      - adapter.py=plugins/fluxer/adapter.py
      - __init__.py=plugins/fluxer/__init__.py
  - name: hermes-ulw-loop-plugin
    files:
      - plugin.yaml=plugins/ulw-loop/plugin.yaml
      - __init__.py=plugins/ulw-loop/__init__.py
      - ulw_loop.py=plugins/ulw-loop/ulw_loop.py
      - state.py=plugins/ulw-loop/state.py
      - phases.py=plugins/ulw-loop/phases.py
      - tokens.py=plugins/ulw-loop/tokens.py
      - quality_gate.py=plugins/ulw-loop/quality_gate.py
      - blocker.py=plugins/ulw-loop/blocker.py
      - steering.py=plugins/ulw-loop/steering.py
  - name: hermes-skill-gitops-plugin
    files:
      - plugin.yaml=plugins/skill-gitops/plugin.yaml
      - __init__.py=plugins/skill-gitops/__init__.py
      - sync.py=plugins/skill-gitops/sync.py
  - name: hermes-profiles
    files:
      - orchestrator.yaml=home/profiles/orchestrator/config.yaml
      - executor.yaml=home/profiles/executor/config.yaml
      - reviewer.yaml=home/profiles/reviewer/config.yaml
