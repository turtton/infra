---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-home-config
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: custom
      default: deepseek-v4-pro
      base_url: https://crof.ai/v1
      api_key: ${OPENAI_API_KEY}
    personality:
      name: Main Assistant
      restrict_to_workspace: false
    tools:
      append_file: true
      edit_file: true
      read_file: true
      write_file: true
      list_dir: true
      exec: true
      web: true
      web_fetch: true
      send_file: true
      spawn: true
      subagent: true
      message: true
      cron: true
      skills: true
      find_skills: true
      install_skill: true
    skills:
      external_dirs:
        - /hermes/skills
    approvals:
      mode: auto
    logging:
      level: info
    platforms:
      webhook:
        enabled: true
        extra:
          port: 8644
          secret: "INSECURE_NO_AUTH"
          routes:
            k8s-alerts:
              secret: "INSECURE_NO_AUTH"
              prompt: |
                以下のKubernetesアラートを解析して、改善案を日本語でアドバイスしてください。

                {__raw__}

                以下の観点で答えて：
                1. このアラートの原因として考えられること
                2. 具体的な改善手順（kubectlコマンドを含む）
                3. 再発防止策
              deliver: "discord"
