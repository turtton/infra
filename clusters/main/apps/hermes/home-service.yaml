---
apiVersion: v1
kind: Service
metadata:
  name: hermes-home
  namespace: hermes
  labels:
    app: hermes-home
spec:
  selector:
    app: hermes-home
  ports:
    - name: http
      port: 9119
      targetPort: 9119
      protocol: TCP
    - name: webhook
      port: 8644
      targetPort: 8644
      protocol: TCP