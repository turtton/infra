---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-lepi-webui
  namespace: hermes
  annotations:
    tailscale.com/funnel: "false"
    tailscale.com/tags: "tag:hermes"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes-lepi
      port:
        number: 9119
  tls:
    - hosts:
        - hermes-lepi
