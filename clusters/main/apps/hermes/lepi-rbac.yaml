apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-lepi-self-access
  namespace: hermes
  labels:
    app: hermes-lepi
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["hermes-lepi-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-lepi-self-access
  namespace: hermes
  labels:
    app: hermes-lepi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-lepi-self-access
subjects:
  - kind: ServiceAccount
    name: hermes-lepi
    namespace: hermes