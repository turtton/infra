name: ulw-loop
label: ULW Loop
kind: standalone
version: 2.3.0
description: >-
  ULW-loop (Explore → Plan → Plan-Review → Execute → Verify → Review → Fix) for Hermes Agent.
  Full implementation with:
  - Durable state management (goals.json + ledger.jsonl)
  - Token-based phase transitions (<promise>DONE</promise> protocol)
  - Plan review gate: reviewer must approve the plan before execution starts
  - Quality Gate checks (criteria coverage + adversarial coverage)
  - Blocker classification and 3-strike escalation
  - Steering (add/split/revise goals mid-execution)
  - Auto-resume with 2-strike no-progress cap
  - Kanban integration for multi-agent orchestration
  - Dedicated planner profile (kimi-k3, reasoning max) for goal decomposition
  
  Usage: /ulw-loop <goal description>
  Steering: /ulw-steer <action> <session-id> <params>
  Agent CLI: hermes ulw-loop <goal> --context <summary> --platform discord
             --chat-id <id> --thread-id <id>
author: turtton

hooks:
  - pre_llm_call
  - post_llm_call
  - pre_verify
  - on_session_start
  - pre_gateway_dispatch
