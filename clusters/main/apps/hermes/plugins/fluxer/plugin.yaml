name: fluxer
label: Fluxer
kind: platform
version: 1.0.0
description: Fluxer instant messaging platform adapter for Hermes Agent. Supports self-hosted and cloud instances via automatic endpoint discovery from /.well-known/fluxer.
author: turtton

requires_env:
  - name: FLUXER_TOKEN
    description: "Bot API token from Fluxer OAuth2 application"
    prompt: "Fluxer bot token"
    url: "https://fluxer.app/developers/applications"
    password: true
  - name: FLUXER_CHANNEL
    description: "Channel to join (e.g., #general)"
    prompt: "Channel"
    password: false
  - name: FLUXER_INSTANCE_URL
    description: "Self-hosted Fluxer instance base URL (e.g. https://fluxer.example.com). Endpoints are auto-discovered from /.well-known/fluxer."
    prompt: "Instance URL (e.g. https://fluxer.example.com)"
    password: false

optional_env:
  - name: FLUXER_HOME_CHANNEL
    description: "Default channel for cron delivery"
    prompt: "Home channel ID (or empty)"
    password: false
  - name: FLUXER_ALLOWED_USERS
    description: "Comma-separated user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: FLUXER_ALLOW_ALL_USERS
    description: "Set to 'true' to allow all users to talk to the bot"
    prompt: "Allow all users"
    password: false
  - name: FLUXER_ALLOW_ADMIN_FROM
    description: "Comma-separated user IDs with admin privileges (full slash command access)"
    prompt: "Admin user IDs (comma-separated)"
    password: false
  - name: FLUXER_USER_ALLOWED_COMMANDS
    description: "Comma-separated list of slash commands regular users may run"
    prompt: "User allowed commands (comma-separated)"
    password: false
  - name: FLUXER_HISTORY_BACKFILL
    description: "Enable backfill of recent channel messages for context (default: true)"
    prompt: "Enable history backfill"
    password: false
  - name: FLUXER_HISTORY_BACKFILL_LIMIT
    description: "Max messages to scan backwards for context (default: 50)"
    prompt: "History backfill limit"
    password: false
