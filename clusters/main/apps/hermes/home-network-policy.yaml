---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-home-egress
  namespace: hermes
  labels:
    app: hermes-home
spec:
  podSelector:
    matchLabels:
      app: hermes-home
  policyTypes:
    - Egress
  egress:
    # External HTTPS (Discord, GitHub, Crof AI API, Fluxer, etc.)
    - ports:
        - protocol: TCP
          port: 443
    # DNS resolution
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Other services within the namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
