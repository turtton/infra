---
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: lepi
  namespace: openclaw
spec:
  envFrom:
    - secretRef:
        name: openclaw-shared-secrets
    - secretRef:
        name: openclaw-lepi-secrets

  env:
    - name: GITHUB_REPO_URL
      value: "https://github.com/turtton/doumels.git"
    - name: GITHUB_BASE_BRANCH
      value: "main"

  storage:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn

  config:
    mergeMode: overwrite
    raw:
      auth:
        profiles:
          github-copilot:github:
            provider: github-copilot
            mode: token
      models:
        providers:
          voyage:
            baseUrl: "https://api.voyageai.com/v1"
            models:
              - id: voyage-4
                name: voyage-4
      agents:
        defaults:
          model:
            primary: github-copilot/claude-sonnet-4.6
          memorySearch:
            provider: voyage
            remote:
              batch:
                enabled: false
            model: voyage-4
          compaction:
            mode: safeguard
          maxConcurrent: 4
          subagents:
            maxConcurrent: 8
        # non-main agentはagentDirとworkspaceを絶対パスで指定すること
        list:
          - id: main
            default: true
            subagents:
              allowAgents:
                - config-ops
                - github-ops
          - id: github-ops
            name: GitHub Ops
            agentDir: /home/openclaw/.openclaw/agents/github-ops/agent
            workspace: /home/openclaw/.openclaw/workspace/agents/github-ops
            tools:
              allow:
                - "group:fs"
                - exec
                - web_search
                - web_fetch
              exec:
                security: allowlist
                ask: "off"
          - id: config-ops
            agentDir: /home/openclaw/.openclaw/agents/config-ops/agent
            workspace: /home/openclaw/.openclaw/workspace/agents/config-ops
            tools:
              allow:
                - "group:fs"
                - exec
                - web_search
                - web_fetch
              exec:
                security: allowlist
                ask: "off"
      tools:
        profile: full
        web:
          search:
            enabled: true
          fetch:
            enabled: true
        exec:
          security: full
          ask: "off"
      bindings:
        - agentId: github-ops
          comment: Route target Discord channel to github-ops
          match:
            channel: discord
            peer:
              kind: channel
              id: "719807203158130688"
            guildId: "719207321854541874"
      messages:
        ackReactionScope: group-mentions
      commands:
        native: auto
        nativeSkills: auto
        restart: true
        ownerDisplay: raw
      approvals:
        exec:
          enabled: false
      channels:
        discord:
          enabled: true
          groupPolicy: allowlist
          streaming: "partial"
          dmPolicy: allowlist
          allowFrom:
            - "275915497353117697"
          guilds:
            "719207321854541874":
              channels:
                "719807203158130688":
                  allow: true
          execApprovals:
            enabled: false
      gateway:
        controlUi:
          allowedOrigins:
            - "https://openclaw-lepi.taile2777.ts.net"
        auth:
          mode: token
          allowTailscale: true
      skills:
        install:
          nodeManager: bun
      plugins:
        entries:
          discord:
            enabled: true

  initContainers:
    - name: init-exec-approvals
      image: busybox:1.37.0
      command: ["cp", "/config/exec-approvals.json", "/data/exec-approvals.json"]
      volumeMounts:
        - name: exec-approvals-config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data

  extraVolumes:
    - name: config-ops-workspace
      configMap:
        name: config-ops-workspace
    - name: github-ops-workspace
      configMap:
        name: github-ops-workspace
        defaultMode: 0755
    - name: exec-approvals-config
      configMap:
        name: exec-approvals-lepi

  extraVolumeMounts:
    - name: config-ops-workspace
      mountPath: /home/openclaw/.openclaw/workspace/agents/config-ops/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    - name: github-ops-workspace
      mountPath: /home/openclaw/.openclaw/workspace/agents/github-ops/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    - name: github-ops-workspace
      mountPath: /home/openclaw/.openclaw/workspace/agents/github-ops/TOOLS.md
      subPath: TOOLS.md
      readOnly: true
    - name: github-ops-workspace
      mountPath: /home/openclaw/.openclaw/workspace/agents/github-ops/scripts/bootstrap-repo.sh
      subPath: bootstrap-repo.sh
      readOnly: true
    - name: github-ops-workspace
      mountPath: /home/openclaw/.openclaw/workspace/agents/github-ops/MEMORY.md
      subPath: MEMORY.md
      readOnly: true

  security:
    networkPolicy:
      allowedIngressNamespaces:
        - tailscale

  selfConfigure:
    enabled: true
    allowedActions:
      - config
      - skills
      - workspaceFiles
