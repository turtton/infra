---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lepinoid-infra
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://github.com/Lepinoid/infra
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lepinoid-tenant-setup
  namespace: flux-system
spec:
  wait: true
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/main/tenants/base
  prune: true
  postBuild:
    substitute:
      tenant_name: lepinoid
      # 既存テナントの枠に CI 4枠 (12 CPU / 24Gi) と ARC 常駐分を追加する。
      quota_requests_cpu: "25"
      quota_requests_memory: 50Gi
      quota_limits_cpu: "34"
      quota_limits_memory: 66Gi
      quota_pvc: "24"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lepinoid-arc-rbac
  namespace: flux-system
spec:
  wait: true
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/main/tenants/lepinoid-arc-rbac
  prune: true
  dependsOn:
    - name: lepinoid-tenant-setup
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lepinoid-workloads
  namespace: flux-system
spec:
  suspend: false
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: lepinoid-infra
  path: ./
  prune: true
  targetNamespace: lepinoid
  serviceAccountName: lepinoid-deployer
  dependsOn:
    - name: lepinoid-tenant-setup
    - name: lepinoid-arc-rbac
    - name: lepinoid-arc-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age-lepinoid
