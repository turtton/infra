# 日次の R2 アップロードはコストに見合わないため週次とし、日次ローカルスナップショットで補完する
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup-gameserver
  namespace: longhorn-system
spec:
  # cron は longhorn-manager のタイムゾーン (UTC) 基準。金曜 12:00 JST = 03:00 UTC
  cron: "0 3 * * 5"
  task: backup
  retain: 4
  concurrency: 1
  groups:
    - gameserver
  labels:
    schedule: weekly
---
# 短期ロールバック用。同一ボリューム内のスナップショットのため replica 1 構成では
# ボリューム消失時の復旧にはならず、災害復旧は週次バックアップが担う
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot-gameserver
  namespace: longhorn-system
spec:
  cron: "0 4 * * *"
  task: snapshot
  retain: 7
  concurrency: 1
  groups:
    - gameserver
  labels:
    schedule: daily
