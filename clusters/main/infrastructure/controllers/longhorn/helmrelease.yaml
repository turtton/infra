---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m0s
  # engine image 展開を伴うロールアウトはデフォルトの 5m を超えがちなため
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h0m0s
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      # Longhorn はダウングレード不能のため自動ロールバックを無効化
      retries: 0
  values:
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/lib/longhorn
      guaranteedInstanceManagerCPU: 5
      storageReservedPercentageForDefaultDisk: 20
    defaultBackupStore:
      backupTarget: s3://longhorn-backup@apac/
      backupTargetCredentialSecret: longhorn-r2-credentials
    persistence:
      defaultClassReplicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
