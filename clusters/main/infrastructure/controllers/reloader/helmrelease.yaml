---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m0s
  chart:
    spec:
      chart: reloader
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 12h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      reloadStrategy: annotations
      auto:
        # Automatically reload all Deployments/StatefulSets that have:
        # secret.reloader.stakater.com/reload or configmap.reloader.stakater.com/reload annotation
        # This covers our Fluxer secrets pattern
        enabled: true
      # Watch all namespaces
      ignoreNamespaces: ""
