apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# data worker統合作業中の再デプロイ抑止。
# 作業完了後はこのpatchをrevertし、手動で kubectl scale deploy kustomize-controller --replicas=1
# を実行して reconciler を復帰させること（revertの適用自体がkustomize-controllerに依存するため）。
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kustomize-controller
      namespace: flux-system
    spec:
      replicas: 0
  target:
    kind: Deployment
    name: kustomize-controller
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: helm-controller
      namespace: flux-system
    spec:
      replicas: 0
  target:
    kind: Deployment
    name: helm-controller
