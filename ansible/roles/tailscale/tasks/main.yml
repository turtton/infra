---
- name: Validate auth key is set
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: "tailscale_auth_key must be set (use sops)"

- name: Add Tailscale apt signing key
  ansible.builtin.apt_key:
    url: >-
      https://pkgs.tailscale.com/stable/debian/
      {{ ansible_facts['distribution_release'] }}.noarmor.gpg
    keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/debian
      {{ ansible_facts['distribution_release'] }} main
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Connect to Tailscale
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --auth-key={{ tailscale_auth_key }}
      {% if tailscale_accept_routes %}--accept-routes{% endif %}
      {% if not tailscale_accept_dns %}--accept-dns=false{% endif %}
      {% for tag in tailscale_advertise_tags %}--advertise-tags={{ tag }}{% if not loop.last %} {% endif %}{% endfor %}
      {{ tailscale_extra_args }}
  no_log: true
  when: >-
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState != "Running"
  changed_when: true

- name: Apply Tailscale DNS settings
  ansible.builtin.command:
    cmd: "tailscale set --accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
  changed_when: false
  when: >-
    tailscale_status.rc == 0 and
    (tailscale_status.stdout | from_json).BackendState == "Running"
