---
# bigtcze/pve-exporter (Go)
pve_exporter_version: "1.12.0"
pve_exporter_listen_port: 9221
pve_exporter_config_dir: /etc/pve-exporter
pve_exporter_user: pve-exporter
pve_exporter_group: pve-exporter
pve_exporter_bin: /usr/local/bin/pve-exporter
pve_exporter_checksum: "eb3adf202699d10196d24a270a0605b29a1a68091611313bf49804052c1cb405"

# PVE API Token authentication
# `pve_exporter_api_token_value` MUST be overridden (e.g. via sops-encrypted group_vars).
# `pve_exporter_api_user` is the full token reference in PVE format USER@REALM!TOKENID.
# Verify it matches an existing token:  pveum user token list <user>
# When the token has Privilege Separation enabled (default in newer PVE),
# the token itself ALSO needs an ACL — granting only the user is insufficient:
#   pveum acl modify / --tokens '<user@realm!tokenid>' --roles PVEAuditor
# See docs/proxmox-prerequisites.md for the full setup and rotation procedure.
pve_exporter_api_user: "monitoring@pve!monitoring"
pve_exporter_api_token_value: ""
pve_exporter_verify_ssl: false
