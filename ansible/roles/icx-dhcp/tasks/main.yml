---
- name: Check current DHCP pool configuration
  community.network.icx_command:
    commands:
      - "show running-config | include dhcp-server"
  register: dhcp_check

- name: Configure DHCP server pools
  community.network.icx_config:
    lines: >-
      {{
        ['network ' + item.network,
         'dhcp-default-router ' + item.default_router,
         'dns-server ' + (item.dns_servers | join(' ')),
         'lease ' + (item.lease_days | string) + ' ' + (item.lease_hours | string) + ' ' + (item.lease_minutes | string)]
        + (item.excluded_ranges | default([])
           | map(attribute='start')
           | zip(item.excluded_ranges | default([]) | map(attribute='end'))
           | map('join', ' ')
           | map('regex_replace', '^', 'excluded-address ')
           | list)
        + ['deploy']
      }}
    parents:
      - "ip dhcp-server pool {{ item.name }}"
  loop: "{{ icx_dhcp_pools }}"
  loop_control:
    label: "DHCP pool {{ item.name }}"
  when: "'pool ' + (item.name | lower) not in (dhcp_check.stdout[0] | default('') | lower)"

- name: Disable DHCP client (required before enabling DHCP server)
  community.network.icx_config:
    lines:
      - "ip dhcp-client disable"

- name: Enable DHCP server
  community.network.icx_config:
    lines:
      - "ip dhcp-server enable"
