---
- name: Configure VLAN definitions
  community.network.icx_config:
    lines:
      - "router-interface ve {{ item.id }}"
    parents:
      - "vlan {{ item.id }} name {{ item.name }} by port"
  loop: "{{ icx_vlans }}"
  loop_control:
    label: "VLAN {{ item.id }} ({{ item.name }})"

- name: Configure VLAN untagged ports
  community.network.icx_config:
    lines:
      - "untagged {{ item.untagged_ports }}"
    parents:
      - "vlan {{ item.id }} name {{ item.name }} by port"
  loop: "{{ icx_vlans | selectattr('untagged_ports', 'defined') | list }}"
  loop_control:
    label: "VLAN {{ item.id }} untagged ports"
  when: item.untagged_ports | default('') | length > 0

- name: Configure VE interfaces with static IP
  community.network.icx_config:
    lines:
      - "ip address {{ item.ip_address }}"
    parents:
      - "interface ve {{ item.id }}"
  loop: "{{ icx_vlans | selectattr('ip_address', 'defined') | list }}"
  loop_control:
    label: "VE {{ item.id }}"
  when: item.ip_address | default('') | length > 0
  register: ve_ip_result
  failed_when:
    - ve_ip_result is failed
    - "'duplicate ip address' not in (ve_ip_result.msg | default(''))"

- name: Configure default route
  community.network.icx_config:
    lines:
      - "ip route 0.0.0.0/0 {{ icx_default_route }}"
  when: icx_default_route | default('') | length > 0
