---
- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ haproxy_minecraft_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ haproxy_minecraft_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_minecraft_install_dir }}/haproxy.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Restart haproxy-minecraft

- name: Deploy HAProxy Lua script
  ansible.builtin.copy:
    src: files/haproxy_minecraft.lua
    dest: "{{ haproxy_minecraft_install_dir }}/haproxy_minecraft.lua"
    owner: root
    group: root
    mode: "0644"

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ haproxy_minecraft_install_dir }}/.env"
    owner: root
    group: root
    mode: "0644"
  notify: Restart haproxy-minecraft

- name: Deploy systemd service
  ansible.builtin.template:
    src: haproxy-minecraft.service.j2
    dest: /etc/systemd/system/haproxy-minecraft.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart haproxy-minecraft

- name: Enable and start haproxy-minecraft
  ansible.builtin.systemd:
    name: haproxy-minecraft
    enabled: true
    state: started
    daemon_reload: true
